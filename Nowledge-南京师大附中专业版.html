  let state = Store.read() || freshState();
  migrate(state);

  function migrate(s){
    // —— 版本比对放在最前：先按旧版本做结构性转换，再做字段补位 ——
    if(s.version === undefined) s.version = 1; // 无版本号的旧数据按基线 v1 处理
    // 注意：结构性变更（如重命名字段）必须放在下方「补字段」之前，
    // 否则补字段会用默认值占位，破坏旧数据的真实结构。

    // —— 字段补位（向前兼容，仅新增缺失字段）——
    if(!s.exams) s.exams = [];
    if(!s.settings) s.settings = freshState().settings;
    if(s.settings.focusPreset === undefined) s.settings.focusPreset = '25-5';
    if(!s.settings.shortcuts) s.settings.shortcuts = { e:'e', f:'f', n:'n', p:'p' };
    if(!s.meta) s.meta = { onboardingShown:false, firstOpen: Utils.dateKey(new Date()) };
    if(!s.days) s.days = {};
    if(!s.ai) s.ai = { enabled:false, list:[], activeId:null };
    // 修复旧版「测试连接」遗留：临时 __test__ 配置可能被 debounce 写进存档，
    // 并让 activeId 指向已不存在的项，导致 AI 整体不可用。读入时自动净化。
    if(!Array.isArray(s.ai.list)) s.ai.list = [];
    s.ai.list = s.ai.list.filter(x=>x && x.id && x.id!=='__test__');
    if(s.ai.activeId==='__test__' || (s.ai.activeId && !s.ai.list.some(x=>x.id===s.ai.activeId))){
      s.ai.activeId = s.ai.list.length ? s.ai.list[0].id : null;
    }

    // 版本归一：写回当前 schema 版本
    s.version = SCHEMA_VERSION;
  }

  // 说明：当前 UI 更新采用「动作后手动调用 Renderer.renderXxx()」的方式，
  // 不依赖订阅机制；subscribe/notify 保留为后续可选扩展，未接入渲染流程。
  const listeners = new Set();
  function subscribe(fn){ listeners.add(fn); return ()=>listeners.delete(fn); }
  function notify(kind){ listeners.forEach(fn=>{ try{ fn(kind); }catch(e){ console.error(e); } }); }

  const persist = Utils.debounce(()=>{ Store.write(state); }, 250);
  function persistNow(){ persist.flush(); }

  function ensureDay(key){
    if(!state.days[key]){
      const assignments = {};
      state.subjects.forEach(s=>{ assignments[s.id] = { text:'', completed:false, completedAt:null, updatedAt:null, items:null }; });
      state.days[key] = { assignments, note:'', quoteIndex: Utils.hashStr(key) % QUOTES.length, quoteOverride:null, focusSessions:0, focusSeconds:0 };
    }else{
      // 确保新增学科在旧日期里也存在记录
      state.subjects.forEach(s=>{
        if(!state.days[key].assignments[s.id]){
          state.days[key].assignments[s.id] = { text:'', completed:false, completedAt:null, updatedAt:null, items:null };
        }
      });
    }
    return state.days[key];
  }

  // 注意：ensureDay 有写副作用（补全缺失的日记录），但不触发 persist。
  // 调用方在修改数据后需自行调用 State.persistNow()，否则改动仅存于内存。
  // 此行为为历史遗留，重构时需注意：渲染路径调用 ensureDay 不会自动保存。

  function pruneHistory(){
    const todayKey = Utils.dateKey(new Date());
    const keys = Object.keys(state.days);
    keys.forEach(k=>{
      if(Utils.daysBetween(k, todayKey) > HISTORY_KEEP_DAYS){
        delete state.days[k];
      }
    });
  }

  function get(){ return state; }
  function set(mutator, kind){
    mutator(state);
    persist();
    notify(kind || 'update');
  }
  function setSync(mutator, kind){
    mutator(state);
    persistNow();
    notify(kind || 'update');
  }
  function replaceAll(newState){
    state = newState;
    migrate(state);
    persistNow();
    notify('all');
  }
  function resetAll(){
    state = freshState();
    persistNow();
    notify('all');
  }

  return { get, set, setSync, subscribe, ensureDay, pruneHistory, replaceAll, resetAll, persistNow };
})();

/* ============================== 5. DateEngine 日期时间 ============================== */
const DateEngine = (() => {
  let viewingKey = Utils.dateKey(new Date());
  let clockTimer = null, dayCheckTimer = null;
  let onTick = ()=>{}, onDayChange = ()=>{};

  function todayKey(){ return Utils.dateKey(new Date()); }
  function getViewingKey(){ return viewingKey; }
  function setViewingKey(key){ viewingKey = key; }
  function isViewingToday(){ return viewingKey === todayKey(); }

  function start(tickCb, dayChangeCb){
    onTick = tickCb; onDayChange = dayChangeCb;
    tick();
    clockTimer = setInterval(tick, 1000);
    dayCheckTimer = setInterval(checkDayRollover, 20000);
  }
  function tick(){ onTick(new Date()); }
  let lastKnownDay = todayKey();
  function checkDayRollover(){
    const k = todayKey();
    if(k !== lastKnownDay){
      const wasViewingToday = (viewingKey === lastKnownDay);
      lastKnownDay = k;
      if(wasViewingToday) viewingKey = k;
      onDayChange(k);
    }
  }
  return { todayKey, getViewingKey, setViewingKey, isViewingToday, start };
})();

/* ============================== 6. QuoteEngine 语录系统 ============================== */
const QuoteEngine = (() => {
  function getForDay(dayRecord){
    const idx = (dayRecord.quoteOverride !== null && dayRecord.quoteOverride !== undefined)
      ? dayRecord.quoteOverride : dayRecord.quoteIndex;
    return QUOTES[idx % QUOTES.length];
  }
  function next(dayRecord){
    const current = (dayRecord.quoteOverride !== null && dayRecord.quoteOverride !== undefined)
      ? dayRecord.quoteOverride : dayRecord.quoteIndex;
    let n = (current + 1 + Math.floor(Math.random()*3)) % QUOTES.length;
    if(n === current) n = (n+1) % QUOTES.length;
    dayRecord.quoteOverride = n;
    return QUOTES[n];
  }
  return { getForDay, next };
})();

/* ============================== 7. LayoutEngine 自适应排版 ============================== */
/*
 * 四层架构：
 * 1. 策略层 - 定义约束、目标、兜底（调用方）
 * 2. 求解层 - 推理优先，搜索为底（本模块核心）
 * 3. 测量层 - 提供"参数→几何"能力（MeasureAdapter）
 * 4. 适配层 - 连接渲染器，含过渡动画
 *
 * 核心改进：
 * - 给定列数 → 二分查找最大字号 O(log n)
 * - 候选列数仅 3-5 个（而非穷举）
 * - 缓存上次方案，内容变化小时优先复用
 */
const LayoutEngine = (() => {
  // === 配置常量 ===
  const MIN_CARD_WIDTH = 190;
  const CLASS_MIN_CARD_WIDTH = 250;
  const MIN_FONT_PX = 13;
  const MAX_FONT_PX = 24;
  const FONT_STEP = 0.5;

  // === 用户偏好记忆（按场景隔离） ===
  const userPrefs = { edit: null, classroom: null };

  // === 状态缓存（按场景隔离，防止跨模式稳定性污染） ===
  const lastResults = { edit: null, classroom: null };

  // === 设备类型检测（使用容器宽度而非 window.innerWidth） ===
  function detectDeviceType(availW) {
    if (availW < 768) return 'phone';
    if (availW >= 1440) return 'projector';
    return 'desktop';
  }

  // === 内容密度检测 ===
  function detectContentDensity(n, availW, availH) {
    // 根据卡片数量和可用空间判断密度
    const avgCardArea = (availW * availH) / Math.max(1, n);
    if (avgCardArea < 18000) return 'dense'; // 内容多，空间少
    if (avgCardArea > 40000) return 'loose'; // 内容少，空间大
    return 'medium';
  }

  // === 智能策略选择 ===
  function selectStrategy(n, availW, availH, classroom) {
    const device = detectDeviceType(availW);
    const density = detectContentDensity(n, availW, availH);
    const key = classroom ? 'classroom' : 'edit';

    // 如果有用户上次的手动调整，优先使用
    if (userPrefs[key]) {
      return { ...userPrefs[key], source: 'user_preference' };
    }

    // 基于设备和内容密度自动选择
    let colsBias = 0; // 负数=少列，正数=多列
    let fontBias = 0; // 负数=小字，正数=大字

    if (classroom) {
      // 教室模式：优先大字体、少列
      if (device === 'projector') {
        colsBias = -1;
        fontBias = 2;
      } else if (device === 'phone') {
        colsBias = -1;
        fontBias = 1;
      }
    } else {
      // 编辑模式：根据内容密度调整
      if (density === 'dense') {
        colsBias = -1;
        fontBias = -1;
      } else if (density === 'loose') {
        colsBias = 1;
        fontBias = 1;
      }
    }

    return {
      colsBias,
      fontBias,
      density,
      device,
      source: 'auto'
    };
  }

  // === 记忆用户手动调整 ===
  function rememberPreference(result, classroom) {
    const key = classroom ? 'classroom' : 'edit';
    if (result._userInitiated) {
      // 反推出 colsBias/fontBias 存入 userPrefs
      // 需要从 result 中获取学科数量（通过高度和卡片宽度反推，或直接用 cols 与 balanced 比较）
      const maxCols = Math.min(6, Math.max(1, Math.floor(result.availW / (classroom ? 280 : 220))));
      const balancedCols = Math.ceil(maxCols / 2);
      const colsBias = result.cols < balancedCols ? -1 : result.cols > balancedCols ? 1 : 0;
      const idealFont = classroom ? 24 : 18;
      const fontBias = result.fontPx >= idealFont ? 1 : result.fontPx < idealFont ? -1 : 0;
      userPrefs[key] = {
        colsBias,
        fontBias,
        rememberedAt: Date.now()
      };
    }
  }

  // === 第三层：测量层 ===
  const MeasureAdapter = {
    getContainerSize(container) {
      const rect = container.getBoundingClientRect();
      return {
        width: Math.max(280, rect.width),
        height: Math.max(180, rect.height)
      };
    },

    measureGridHeight(grid) {
      // 同时支持 .card（编辑模式）和 .classroom-card（教室模式）
      const cards = [...grid.querySelectorAll('.card:not(.is-hidden-subject), .classroom-card')];
      if (!cards.length) return 0;
      const gridRect = grid.getBoundingClientRect();
      let maxBottom = 0;
      for (const card of cards) {
        const cardRect = card.getBoundingClientRect();
        maxBottom = Math.max(maxBottom, cardRect.bottom - gridRect.top);
      }
      return Math.ceil(maxBottom);
    }
  };

  // === 第二层：求解层 ===

  /**
   * 根据字号 + 场景联动 padding / gap
   * 使用线性插值避免阈值跳变，字号渐变时间距平滑过渡
   */
  function resolvePaddingGap(fontPx, classroom) {
    const maxF = classroom ? 32 : MAX_FONT_PX;
    const t = Math.min(1, Math.max(0, (fontPx - MIN_FONT_PX) / (maxF - MIN_FONT_PX)));
    if (classroom) {
      return {
        pad: Math.round((5 + 5 * t) * 2) / 2,
        gap: Math.round((10 + 8 * t) * 2) / 2,
        line: fontPx >= 26 ? 1.38 : fontPx >= 20 ? 1.32 : fontPx >= 15 ? 1.28 : 1.24
      };
    }
    return {
      pad: Math.round((10 + 4 * t) * 2) / 2,
      gap: Math.round((10 + 2 * t) * 2) / 2,
      line: fontPx >= 18 ? 1.42 : fontPx >= 16 ? 1.36 : fontPx >= 14 ? 1.30 : 1.26
    };
  }

  /**
   * 二分查找 + 宽窗口微调：给定列数，找能完整放入视口的最大字号
   * 返回 null 表示该列数下卡片宽度已低于最小限制
   */
  function findMaxFontByCols(cols, availW, availH, grid, classroom) {
    const minCardW = classroom ? CLASS_MIN_CARD_WIDTH : MIN_CARD_WIDTH;
    const cardWidth = (availW - (cols - 1) * 12) / cols;
    if (cardWidth < minCardW) return null;

    // 二分查找：字号范围小（13-24px），约5-6次测量
    // 教室模式允许更大字号（最高32px），与 resolvePaddingGap 的 maxF 保持一致
    const maxFont = classroom ? 32 : MAX_FONT_PX;
    let lo = MIN_FONT_PX;
    let hi = maxFont;
    let best = MIN_FONT_PX;
    while (lo <= hi) {
      const mid = Math.round((lo + hi) / 2 / FONT_STEP) * FONT_STEP; // 对齐到 0.5px 步长
      const { pad, gap } = resolvePaddingGap(mid, classroom);
      applyStyles(grid, cols, mid, pad, gap, classroom, true);
      void grid.offsetHeight;
      const height = MeasureAdapter.measureGridHeight(grid);
      if (height <= availH + 2) {
        best = mid;
        lo = mid + FONT_STEP;
      } else {
        hi = mid - FONT_STEP;
      }
    }
    // 恢复 grid 到最终 best 状态
    const { pad: bestPad, gap: bestGap } = resolvePaddingGap(best, classroom);
    applyStyles(grid, cols, best, bestPad, bestGap, classroom, true);
    return best;
  }

  /** 生成 3-5 个候选列数（平衡、最小、最大及邻近值） */
  function generateColumnCandidates(n, availW, classroom, strategy = null) {
    const minCardW = classroom ? CLASS_MIN_CARD_WIDTH : MIN_CARD_WIDTH;
    const minCols = Math.max(1, Math.ceil(n / Math.floor(availW / minCardW)));
    const maxCols = Math.min(6, Math.max(1, Math.floor(availW / (classroom ? 280 : 220))));

    const candidates = new Set();
    const balanced = Math.round(n / Math.max(1, Math.floor(n / 2)));

    // 根据策略调整候选范围
    let preferredMin = minCols, preferredMax = maxCols;
    if (strategy) {
      if (strategy.colsBias < 0) {
        // 倾向少列：缩小上限
        preferredMax = Math.max(minCols, maxCols + strategy.colsBias);
      } else if (strategy.colsBias > 0) {
        // 倾向多列：扩大下限
        preferredMin = Math.min(maxCols, minCols + strategy.colsBias);
      }
    }

    // 优先添加平衡列数
    if (balanced >= preferredMin && balanced <= preferredMax) {
      candidates.add(balanced);
    }
    // 添加边界值
    if (preferredMin >= 1 && preferredMin <= 6) candidates.add(preferredMin);
    if (preferredMax >= 1 && preferredMax <= 6) candidates.add(preferredMax);
    // 补充邻近值
    for (let c = preferredMin; c <= preferredMax && candidates.size < 5; c++) {
      candidates.add(c);
    }
    return Array.from(candidates).sort((a, b) => a - b);
  }

  /** 对候选方案打分 */
  function scoreSolution(cols, fontPx, height, availH, n, classroom, strategy = null, availW = 800) {
    const fits = height <= availH + 1;
    const minCardW = classroom ? CLASS_MIN_CARD_WIDTH : MIN_CARD_WIDTH;
    const widthPerCard = (availW - 12 * (cols - 1)) / cols;

    // 窄卡惩罚（唯一硬性约束）
    if (widthPerCard < minCardW) return { score: -Infinity, fits: false, reason: '卡片过窄' };

    // 主要评分：字号越大越好（核心目标）
    // 次要评分：溢出时惩罚，余量时轻微奖励
    const overflowPenalty = fits ? 0 : (height - availH) * 100;
    const spaceBonus = fits ? Math.min(200, (availH - height)) : 0;

    // 列数均衡性：越接近 n/cols 为整数越好
    const balanceBonus = Math.abs(n / cols - Math.round(n / cols)) < 0.1 ? 50 : 0;

    // 稳定性加成：保持上次的列数（仅在字号相近时有效）
    const key = classroom ? 'classroom' : 'edit';
    const stabilityBonus = lastResults[key] && lastResults[key].cols === cols && Math.abs(lastResults[key].fontPx - fontPx) < 1 ? 100 : 0;

    const fontBonus = (strategy && strategy.fontBias) ? strategy.fontBias * 50 : 0;

    return {
      score: fontPx * 100 + spaceBonus + balanceBonus + stabilityBonus - overflowPenalty + fontBonus,
      fits,
      reason: fits
        ? `已放入视口，剩余 ${Math.round(availH - height)}px`
        : `超出视口 ${Math.round(height - availH)}px`
    };
  }

  /**
   * 将方案应用到 grid DOM（双变量名支持）
   * --grid-* 系列：编辑模式 main 界面
   * --class-* 系列：教室模式 classroomView
   * @param {boolean} probe - 探测期标志，true时禁用过渡动画
   */
  function applyStyles(grid, cols, fontPx, padding, gap, classroom, probe = false) {
    const pre = classroom ? '--class' : '--grid';
    const padPre = classroom ? '--class-pad' : '--card-pad';
    const titlePre = classroom ? '--class-title' : '--card-title-size';
    const bodyPre = classroom ? '--class-body' : '--card-body-size';
    grid.style.setProperty(pre + '-gap', gap + 'px');
    grid.style.setProperty(padPre, padding + 'px');
    grid.style.setProperty(titlePre, Math.max(classroom ? 14 : 13, Math.round(fontPx * 1.04 * 10) / 10) + 'px');
    grid.style.setProperty(bodyPre, fontPx + 'px');
    if (classroom) {
      // line height thresholds match resolvePaddingGap classroom branch
      const lineH = fontPx >= 26 ? 1.38 : fontPx >= 20 ? 1.32 : fontPx >= 15 ? 1.28 : 1.24;
      grid.style.setProperty('--class-line', String(lineH));
    }
    grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0,1fr))`;
    // 设置探测标志，控制 CSS transition
    if (probe) {
      grid.dataset.probing = 'true';
    } else {
      delete grid.dataset.probing;
    }
  }

  // === 第二层：求解层 ===

  // === 第一层：策略层（主计算入口） ===
  /**
   * @param {HTMLElement} container - 布局容器
   * @param {HTMLElement} grid - 网格元素
   * @param {number} n - 卡片数量
   * @param {object} opts - { classroom: boolean, fallback: 'scale'|'scroll' }
   */
  function compute(container, grid, n, opts = {}) {
    const { classroom = false, fallback = 'scroll', userInitiated = false } = opts;
    const fallbackScale = fallback === 'scale';

    if (!n) return createDefaultResult(classroom);

    const { width: availW, height: availH } = MeasureAdapter.getContainerSize(container);

    // 智能策略选择
    const strategy = selectStrategy(n, availW, availH, classroom);

    // 生成候选列数（传入策略）
    const colsCandidates = generateColumnCandidates(n, availW, classroom, strategy);

    // 只测量3-4个关键列数：最小、最平衡、中间、最大（减少重排）
    // 用 Set 去重，避免重复测量
    const keySet = new Set();
    if (colsCandidates.length > 0) keySet.add(colsCandidates[0]); // 最小
    // 加入最平衡列数：让 n/cols 最接近整数（如 n=9 时 cols=3，每列正好3个）
    let balanced = colsCandidates[0], bestDev = Infinity;
    for (const c of colsCandidates) {
      const dev = Math.abs(n / c - Math.round(n / c));
      if (dev < bestDev) { bestDev = dev; balanced = c; }
    }
    keySet.add(balanced);
    const midIdx = Math.floor(colsCandidates.length / 2);
    if (midIdx > 0 && midIdx < colsCandidates.length) keySet.add(colsCandidates[midIdx]); // 中间
    if (colsCandidates.length > 1) keySet.add(colsCandidates[colsCandidates.length - 1]); // 最大
    const keyCandidates = Array.from(keySet).sort((a, b) => a - b);

    let bestResult = null;

    for (const cols of keyCandidates) {
      const maxFont = findMaxFontByCols(cols, availW, availH, grid, classroom);
      if (maxFont === null) continue;

      const { pad, gap } = resolvePaddingGap(maxFont, classroom);
      applyStyles(grid, cols, maxFont, pad, gap, classroom, true);
      void grid.offsetHeight;
      const height = MeasureAdapter.measureGridHeight(grid);
      const { score, fits, reason } = scoreSolution(cols, maxFont, height, availH, n, classroom, strategy, availW);

      if (!bestResult || score > bestResult.score) {
        bestResult = {
          cols,
          fontPx: maxFont,
          titleSize: Math.max(classroom ? 14 : 13, Math.round(maxFont * 1.04 * 10) / 10),
          padding: pad,
          gap,
          scroll: !fits,
          height,
          score,
          reason
        };
      }
    }

    if (!bestResult) {
      return createFallbackResult(container, grid, n, classroom, fallbackScale);
    }

    // 最终落定：把最优方案写入 DOM，避免探测残留参数短暂闪现
    // 此时移除 probing 属性，启用 CSS 过渡动画
    applyStyles(grid, bestResult.cols, bestResult.fontPx, bestResult.padding, bestResult.gap, classroom, false);
    const key = classroom ? 'classroom' : 'edit';
    lastResults[key] = { ...bestResult, classroom };

    // 附加策略信息用于调试和显示（必须在 rememberPreference 之前）
    bestResult._strategy = strategy;
    bestResult._userInitiated = userInitiated;
    bestResult.availW = availW; // 传递给 rememberPreference 用于计算 balancedCols

    // 记忆用户偏好（仅当用户主动触发时）
    if (userInitiated) {
      rememberPreference(bestResult, classroom);
    }

    return bestResult;
  }

  function createDefaultResult(classroom) {
    return {
      cols: 1,
      fontPx: classroom ? 18 : 15,
      titleSize: classroom ? 14 : 13,
      padding: 18,
      gap: 14,
      scroll: false,
      height: 0,
      score: 0,
      reason: '无内容'
    };
  }

  /**
   * 兜底方案：根据 fallbackScale 决定是滚动还是整体缩放
   * fallbackScale=true  → 整体缩放，永不滚动（教室模式）
   * fallbackScale=false → 启用滚动（普通编辑模式）
   */
  function createFallbackResult(container, grid, n, classroom, fallbackScale) {
    const { width: availW, height: availH } = MeasureAdapter.getContainerSize(container);
    const cols = Math.min(2, Math.max(1, Math.floor(availW / (classroom ? 280 : 220))));
    // 兜底时也先探测，再落定
    applyStyles(grid, cols, MIN_FONT_PX, 12, 10, classroom, true);
    void grid.offsetHeight;
    const height = MeasureAdapter.measureGridHeight(grid);

    if (fallbackScale) {
      // 教室模式：整体缩放塞满一屏，永远不滚动
      const scale = Math.min(1, availH / Math.max(1, height));
      grid.style.transform = `scale(${scale})`;
      grid.style.transformOrigin = 'top center';
      // 兜底是异常状态，不保留稳定性加成
      lastResults[classroom ? 'classroom' : 'edit'] = null;
      delete grid.dataset.probing; // 防止 probing 泄漏
      return {
        cols,
        fontPx: MIN_FONT_PX,
        titleSize: classroom ? 14 : 13,
        padding: 12,
        gap: 10,
        scroll: false,
        height: availH,
        score: -500,
        reason: `内容过多，已自动缩放 ${Math.round(scale * 100)}% 以适应一屏`,
        scalePercent: Math.round(scale * 100) // 结构化字段，避免字符串切分
      };
    }

    // 落定：移除探测标志，启用过渡
    delete grid.dataset.probing;
    return {
      cols,
      fontPx: MIN_FONT_PX,
      titleSize: classroom ? 14 : 13,
      padding: 12,
      gap: 10,
      scroll: true,
      height,
      score: -1000,
      reason: '所有方案均无法放入视口，已启用滚动兜底'
    };
  }

  /** 清除用户偏好记忆 */
  function clearPrefs(classroom) {
    const key = classroom ? 'classroom' : 'edit';
    userPrefs[key] = null;
  }

  return { compute, MeasureAdapter, clearPrefs };
})();

/* ============================== 8. Dialog 对话框系统 ============================== */
const Dialog = (() => {
  const layer = document.getElementById('dialogLayer');
  let activeBackdrop = null, lastFocused = null, closeCb = null;

  function open({title, bodyNode, actions=[], wide=false, onClose=null}){
    close(true);
    lastFocused = document.activeElement;
    closeCb = onClose;
    const backdrop = document.createElement('div');
    backdrop.className = 'dialog-backdrop';
    const box = document.createElement('div');
    box.className = 'dialog' + (wide?' dialog--wide':'');
    box.setAttribute('role','dialog');
    box.setAttribute('aria-modal','true');
    box.setAttribute('aria-labelledby','dlgTitle');

    const head = document.createElement('div');
    head.className = 'dialog__head';
    const h = document.createElement('h2');
    h.className = 'dialog__title'; h.id='dlgTitle'; h.textContent = title;
    const closeBtn = document.createElement('button');
    closeBtn.className = 'dialog__close'; closeBtn.setAttribute('aria-label','关闭');
    closeBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>';
    closeBtn.addEventListener('click', ()=>close());
    head.appendChild(h); head.appendChild(closeBtn);

    const body = document.createElement('div');
    body.className = 'dialog__body';
    body.appendChild(bodyNode);

    box.appendChild(head); box.appendChild(body);

    if(actions.length){
      const foot = document.createElement('div');
      foot.className = 'dialog__foot' + (actions.find(a=>a.align==='left')?' dialog__foot--split':'');
      const left = document.createElement('div'); left.style.display='flex'; left.style.gap='8px';
      const right = document.createElement('div'); right.style.display='flex'; right.style.gap='8px';
      actions.forEach(a=>{
        const btn = document.createElement('button');
        btn.className = 'btn' + (a.variant==='primary'?' btn--primary':a.variant==='danger'?' btn--danger':'');
        btn.textContent = a.label;
        btn.addEventListener('click', ()=>{ a.onClick && a.onClick(); });
        (a.align==='left'?left:right).appendChild(btn);
      });
      foot.appendChild(left); foot.appendChild(right);
      box.appendChild(foot);
    }

    backdrop.appendChild(box);
    layer.appendChild(backdrop);
    backdrop.addEventListener('mousedown', (e)=>{ if(e.target===backdrop) close(); });
    requestAnimationFrame(()=>{ backdrop.classList.add('is-open'); });
    activeBackdrop = backdrop;

    const focusTarget = box.querySelector('[data-autofocus]') || box.querySelector('input,textarea,button');
    setTimeout(()=>{ focusTarget && focusTarget.focus(); }, 60);

    box.addEventListener('keydown', trapTab);
    return { close: ()=>close(), root: box };
  }
  function trapTab(e){
    if(e.key !== 'Tab' || !activeBackdrop) return;
    const focusables = activeBackdrop.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])');
    if(!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length-1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
  function close(skipRestoreFocus){
    if(!activeBackdrop) return;
    const b = activeBackdrop;
    activeBackdrop = null;
    b.classList.remove('is-open');
    const cb = closeCb; closeCb = null;
    setTimeout(()=>{ b.remove(); }, 220);
    if(cb) cb();
    if(!skipRestoreFocus && lastFocused && lastFocused.focus) lastFocused.focus();
  }
  function isOpen(){ return !!activeBackdrop; }
  function confirm({title, message, confirmLabel='确定', danger=false, onConfirm}){
    const body = document.createElement('div');
    body.className = 'confirm-body';
    body.innerHTML = message;
    open({
      title, bodyNode: body,
      actions:[
        {label:'取消', onClick:()=>close()},
        {label:confirmLabel, variant:danger?'danger':'primary', onClick:()=>{ close(); onConfirm && onConfirm(); }}
      ]
    });
  }
  return { open, close, isOpen, confirm };
})();

/* ============================== 9. Toast 轻量反馈 ============================== */
const Toast = (() => {
  const root = document.getElementById('toastRoot');
  function show(msg, opts={}){
    const el = document.createElement('div');
    el.className = 'toast';
    const span = document.createElement('span');
    span.textContent = msg;
    el.appendChild(span);
    if(opts.undo){
      const btn = document.createElement('button');
      btn.className = 'toast__undo'; btn.textContent = '撤销';
      btn.addEventListener('click', ()=>{ opts.undo(); dismiss(); });
      el.appendChild(btn);
    }
    root.appendChild(el);
    requestAnimationFrame(()=>el.classList.add('is-visible'));
    function dismiss(){
      el.classList.remove('is-visible');
      setTimeout(()=>el.remove(), 240);
    }
    // 悬停暂停计时，移开重新计时，保证不会被「划过」永久滞留
    let remaining = opts.duration || (opts.undo?5000:2200);
    let startedAt = Date.now();
    let timer = setTimeout(dismiss, remaining);
    el.addEventListener('mouseenter', ()=>{
      clearTimeout(timer);
      remaining -= (Date.now() - startedAt);
      if(remaining < 600) remaining = 600;
    });
    el.addEventListener('mouseleave', ()=>{
      startedAt = Date.now();
      timer = setTimeout(dismiss, remaining);
    });
    return dismiss;
  }
  return { show };
})();

/* ============================== 10. FocusTimer 专注时钟 ============================== */
const FocusTimer = (() => {
  // 状态持久化
  const FOCUS_KEY = 'nowledge_focus_state';
  function saveFocusState() {
    try {
      localStorage.setItem(FOCUS_KEY, JSON.stringify({ phase, running, endAt, remainingAtPause, round, savedAt: Date.now() }));
    } catch(e) {}
  }
  function loadFocusState() {
    try {
      const raw = localStorage.getItem(FOCUS_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch(e) { return null; }
  }
  function clearFocusState() {
    try { localStorage.removeItem(FOCUS_KEY); } catch(e) {}
  }

  let phase = 'work'; // work | break
  let running = false;
  let endAt = 0; // 绝对结束时间戳，避免漂移
  let remainingAtPause = 0;
  let round = 1;
  let rafId = null;
let wakeLock = null;
  let audioCtx = null;
  const overlayEl = document.getElementById('focusOverlay');

  function durations(){
    const s = State.get().settings;
    return { work: s.focusWork, brk: s.focusBreak };
  }
  function releaseWakeLock(){
    if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; }
  }
  function acquireWakeLock(){
    if(!navigator || !navigator.wakeLock) return;
    navigator.wakeLock.request('screen').then(l=>{
      wakeLock = l;
      l.addEventListener('release', ()=>{ wakeLock = null; });
    }).catch(()=>{});
  }
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') acquireWakeLock();
  });
  function reset(){
    running = false;
    phase = 'work';
    round = 1;
    remainingAtPause = durations().work;
    renderTime();
    clearFocusState();
  }
  function currentTotal(){ return phase==='work' ? durations().work : durations().brk; }
  function remaining(){
    if(running) return Math.max(0, Math.round((endAt - Date.now())/1000));
    return remainingAtPause;
  }
  function start(){
    if(running) return;
    running = true;
    endAt = Date.now() + remainingAtPause*1000;
    loop();
    saveFocusState();
  }
  function pause(){
    if(!running) return;
    remainingAtPause = remaining();
    running = false;
    if(rafId) cancelAnimationFrame(rafId);
    saveFocusState();
  }
  function toggle(){ running ? pause() : start(); updateUI(); }
  function skip(){
    completePhase(true);
  }
  function loop(){
    if(!running) return;
    const rem = remaining();
    renderTime();
    if(rem <= 0){
      completePhase(false);
      return;
    }
    rafId = requestAnimationFrame(loop);
  }
  function completePhase(manualSkip){
    const wasWork = phase === 'work';
    running = false;
    if(rafId) cancelAnimationFrame(rafId);
    if(wasWork && !manualSkip){
      const secs = durations().work;
      State.set(s=>{
        const day = State.ensureDay(DateEngine.todayKey());
        day.focusSessions += 1;
        day.focusSeconds += secs;
      }, 'focus');
      playChime();
    }
    if(wasWork){ phase = 'break'; }
    else { phase = 'work'; round += 1; }
    remainingAtPause = currentTotal();
    updateUI();
    saveFocusState(); // 保存阶段转换状态
    const s = State.get().settings;
    if(s.autoStartNext && !manualSkip) start();
  }
  function setPreset(preset){
    State.set(s=>{
      s.settings.focusPreset = preset;
      if(preset==='25-5'){ s.settings.focusWork=25*60; s.settings.focusBreak=5*60; }
      else if(preset==='50-10'){ s.settings.focusWork=50*60; s.settings.focusBreak=10*60; }
    }, 'settings');
    reset();
    updateUI();
  }
  function setCustom(workMin, breakMin){
    State.set(s=>{
      s.settings.focusPreset='custom';
      s.settings.focusWork = Utils.clamp(workMin,1,180)*60;
      s.settings.focusBreak = Utils.clamp(breakMin,1,60)*60;
    }, 'settings');
    reset();
    updateUI();
  }
  function playChime(){
    if(!State.get().settings.soundEnabled) return;
    try{
      audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      const t0 = audioCtx.currentTime;
      [880,1320].forEach((freq,i)=>{
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type='sine'; osc.frequency.value=freq;
        gain.gain.setValueAtTime(0, t0+i*0.16);
        gain.gain.linearRampToValueAtTime(0.14, t0+i*0.16+0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0+i*0.16+0.5);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t0+i*0.16); osc.stop(t0+i*0.16+0.55);
      });
    }catch(e){ /* 忽略音频异常，不影响主流程 */ }
  }
  function renderTime(){
    const rem = remaining();
    const m = Utils.pad2(Math.floor(rem/60)), s = Utils.pad2(rem%60);
    const el = document.getElementById('focusTime');
    if(el) el.textContent = `${m}:${s}`;
    document.title = overlayEl.hidden ? '今课 Nowledge · 南师附中' : `${m}:${s} · ${phase==='work'?'专注':'休息'}`;
  }
  function updateUI(){
    overlayEl.dataset.phase = phase;
    document.getElementById('focusPhaseText').textContent = phase==='work' ? '专注时间' : '休息时间';
    document.getElementById('focusRoundText').textContent = `第 ${round} 轮`;
    document.getElementById('focusPlayIcon').innerHTML = running
      ? '<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>'
      : '<path d="M8 5v14l11-7z"/>';
    const day = State.get().days[DateEngine.todayKey()];
    document.getElementById('focusTodaySessions').textContent = day ? day.focusSessions : 0;
    document.getElementById('focusTodayMinutes').textContent = day ? Math.round(day.focusSeconds/60) : 0;
    document.querySelectorAll('#focusPresetSeg button').forEach(b=>{
      const isActive = b.dataset.preset === State.get().settings.focusPreset;
      b.classList.toggle('is-active', isActive);
      b.setAttribute('aria-selected', String(isActive));
    });
    const soundOn = State.get().settings.soundEnabled;
    document.getElementById('focusSoundIcon').innerHTML = soundOn ? ICONS.soundOn : ICONS.soundOff;
    renderTime();
  }
  function isRunning(){ return running; }
  function init(){
    const saved = loadFocusState();
    if (saved && saved.savedAt && (Date.now() - saved.savedAt) < 3600*1000) {
      // 状态在1小时内保存的，恢复
      phase = saved.phase || 'work';
      remainingAtPause = saved.remainingAtPause !== undefined ? saved.remainingAtPause : currentTotal();
      round = saved.round || 1;
      if (saved.running) {
        // 运行中状态：endAt 应该在未来
        if (saved.endAt > Date.now()) {
          running = true;
          const elapsed = (Date.now() - (saved.endAt - remainingAtPause * 1000)) / 1000;
          if (elapsed < remainingAtPause) {
            remainingAtPause -= elapsed;
          } else {
            remainingAtPause = 0;
          }
          endAt = Date.now() + remainingAtPause * 1000;
          if (remainingAtPause > 0) loop();
        } else {
          // endAt 已过期，当作未运行处理
          remainingAtPause = currentTotal();
        }
      } else {
        // 暂停状态：保留 pausedRemaining
        running = false;
      }
    } else {
      remainingAtPause = currentTotal();
    }
    updateUI(); // 确保 UI 显示正确状态
  }
  return { start, pause, toggle, skip, reset, setPreset, setCustom, updateUI, isRunning, init, acquireWakeLock, releaseWakeLock };
})();

/* ============================== 11. Renderer 渲染层 ============================== */
const Renderer = (() => {
  const els = {
    dateText: document.getElementById('dateText'),

  let lastLayoutSig = '';

  function renderClock(d){

    els.quoteZh.textContent = q.zh;

    els.quoteEn.style.display = q.en ? '' : 'none';
    els.quoteAuthor.textContent = q.author ? `— ${q.author}` : '';

  function renderDateBar(){
    const viewing = DateEngine.getViewingKey();
    const isToday = DateEngine.isViewingToday();
    els.dateBar.classList.toggle('is-visible', !isToday);
    if(!isToday){
      els.dateBarLabel.textContent = `正在查看 ${Utils.formatShortDate(viewing)}`;
    }
  }

  function visibleSubjects(){
    return State.get().subjects
      .filter(s=>s.enabled && !s.deletedAt)
      .sort((a,b)=>a.order-b.order);
  }

  function renderStatus(){
    const day = currentDayRecord();
    const subs = visibleSubjects();
    const total = subs.length;
    const done = subs.filter(s=>{ const rec = day.assignments[s.id]; return rec && itemsAllDone(subjectItems(rec)); }).length;
    const pct = total ? Math.round(done/total*100) : 0;
    const todayDay = State.get().days[DateEngine.todayKey()];
    const focusMin = todayDay ? Math.round(todayDay.focusSeconds/60) : 0;

    const r = 7, c = 2*Math.PI*r;
    const offset = c - (pct/100)*c;
    const examChips = State.get().exams.filter(e=>e.date >= DateEngine.todayKey()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,2)
      .map(e=>{
        const days = Utils.daysBetween(DateEngine.todayKey(), e.date);
        return `<span class="exam-chip">${Utils.escapeHtml(e.name)} 还有 <b>${days}</b> 天</span>`;
      }).join('');

    // 保留 layoutHint 元素，只更新 stats 内容
    const hintEl = document.getElementById('layoutHint');
    const statsContainer = document.createElement('span');
    statsContainer.id = 'statsContent';
    statsContainer.style.display = 'contents'; // 避免span-in-span破坏flex gap
    statsContainer.innerHTML = `
      <span class="stat stat--accent">
        <svg class="progress-ring" viewBox="0 0 18 18"><circle cx="9" cy="9" r="${r}" fill="none" stroke="var(--border)" stroke-width="2.6"/><circle cx="9" cy="9" r="${r}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round" transform="rotate(-90 9 9)"/></svg>
        <span class="stat__value">${done}/${total}</span> 已完成 <span style="color:var(--muted-2)">(${pct}%)</span>
      </span>
      <span class="stat">今日专注 <span class="stat__value">${focusMin}</span> 分钟</span>
      ${examChips}
    `;
    // 替换旧内容，保持 layoutHint 不变
    const oldContent = els.statusStats.querySelector('#statsContent');
    if (oldContent) {
      oldContent.replaceWith(statsContainer);
    } else {
      // 如果是第一次渲染，先插入 stats 再 append layoutHint
      els.statusStats.insertBefore(statsContainer, els.statusStats.firstChild);
      if (hintEl && !els.statusStats.contains(hintEl)) {
        els.statusStats.appendChild(hintEl);
      }
    }
  }

    function renderLayoutHint(layout) {
    const hintEl = document.getElementById('layoutHint');
    const hintTextEl = document.getElementById('layoutHintText');
    if (!layout) { hintEl.hidden = true; return; }
    // 默认隐藏，仅在特殊场景（用户偏好 / 异常状态）才显示
    let text = null;
    if (layout._strategy && layout._strategy.source === 'user_preference') {
      text = `📌 已沿用上次布局 (${layout.cols} 列)`;
    } else if (layout.scroll) {
      text = `⚠️ 内容溢出，已启用滚动`;
    }
    if (text) { hintTextEl.textContent = text; hintEl.hidden = false; }
    else hintEl.hidden = true;
  }

  function renderNote(){
    const day = currentDayRecord();
    if(document.activeElement !== els.noteInput){
      els.noteInput.value = day.note || '';
    }
  }

  function subjectMenuIcon(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>';
  }

  function renderGrid(){
    const day = currentDayRecord();
    const subs = visibleSubjects();
    els.noSubjectsState.hidden = subs.length !== 0;
    els.grid.style.display = subs.length ? '' : 'none';
    els.grid.innerHTML = '';
    const mode = State.get().settings.mode;

    subs.forEach(sub=>{
      const rec = day.assignments[sub.id] || {text:'',completed:false,completedAt:null,items:null};
      const items = subjectItems(rec);
      const multi = items.length > 1;
      const doneCount = itemsDoneCount(items);
      const allDone = itemsAllDone(items);
      const card = document.createElement('div');
      card.className = 'card' + (mode==='edit'?' is-clickable':'') + (allDone?' is-done':'') + (multi?' is-multi':'');
      card.setAttribute('role','listitem');
      card.dataset.subjectId = sub.id;
      card.tabIndex = mode==='edit' ? 0 : -1;

      const titleHtml = `<span class="card__title">${sub.custom?'<span class="card__custom-dot" title="自定义学科"></span>':''}${Utils.escapeHtml(sub.name)}</span>`;
      const countHtml = multi ? `<span class="card__count">${doneCount}/${items.length}</span>` : '';
      const checkHtml = `<button class="card__check" aria-label="标记完成" title="标记完成/未完成"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l5 5 11-11"/></svg></button>`;
      const headHtml = `<div class="card__head">${titleHtml}${countHtml}${checkHtml}</div>`;

      let bodyHtml;
      if(multi){
        bodyHtml = `<div class="card__items">` + items.map((it,idx)=>`
          <label class="card__item${it.completed?' is-done':''}">
            <input type="checkbox" class="card__item-check" data-item="${idx}" ${it.completed?'checked':''} aria-label="第 ${idx+1} 项完成">
            <span class="card__item-index">${idx+1}</span>
            <span class="card__item-text">${it.text&&it.text.trim()?Utils.escapeHtml(it.text):'<span class="card__item-empty">空白项</span>'}</span>
          </label>`).join('') + `</div>`;
      } else {
        const hasText = rec.text && rec.text.trim().length>0;
        const bodyText = hasText ? Utils.escapeHtml(rec.text) : (mode==='edit' ? '点击添加今天的作业' : '暂无作业');
        bodyHtml = `<div class="card__body${hasText?'':' is-empty'}">${bodyText}</div>`;
      }

      const metaText = allDone && rec.completedAt ? `完成于 ${rec.completedAt}` : (multi ? `${doneCount}/${items.length} 项完成` : '');
      const footHtml = `<div class="card__foot">
        <span class="card__meta">${metaText}</span>
        <button class="card__menu-btn" aria-label="更多操作" title="更多操作">${subjectMenuIcon()}</button>
      </div>`;

      card.innerHTML = headHtml + bodyHtml + footHtml;
      els.grid.appendChild(card);
    });

    scheduleLayout();
  }

  function scheduleLayout(){
    if(layoutRaf) cancelAnimationFrame(layoutRaf);
    layoutRaf = requestAnimationFrame(applyLayout);
  }
  function applyLayout(){
    const day = currentDayRecord();
    const subs = visibleSubjects();
    if(!subs.length) return;
    const items = subs.map(s=>({ text: subjectItems(day.assignments[s.id]).map(i=>i.text).join('|') }));
    // 使用哈希签名，避免长字符串拼接和持有
    const sig = `${els.gridWrap.clientWidth}x${window.innerHeight}x${Utils.hashStr(items.map(i=>i.text).join('|'))}`;
    // 签名一致说明容器尺寸与内容长度均未变化，跳过重复测量以省掉整轮 reflow。
    if(sig === lastLayoutSig) return;
    lastLayoutSig = sig;
    const isClassroom = State.get().settings.mode === 'classroom';
    // 教室模式传 fallback:'scale'，兜底时整体缩放不滚动；编辑模式允许滚动
    const layout = LayoutEngine.compute(els.gridWrap, els.grid, subs.length, {
      classroom: isClassroom,
      fallback: isClassroom ? 'scale' : 'scroll'
    });

    els.grid.classList.toggle('is-scrollable', layout.scroll);
    els.grid.dataset.cols = String(layout.cols);
    els.grid.dataset.density = layout.fontPx <= 13.5 ? 'compact' : layout.fontPx <= 14.5 ? 'dense' : 'comfortable';
    els.grid.dataset.reason = layout.reason || '';

    // 存储布局信息供调试和显示使用
    els.grid._lastLayout = layout;

    els.grid.setAttribute('aria-label', `今日作业 ${layout.cols} 列自适应布局${layout.scroll?'，内容较多可滚动':''}，${layout.reason||''}`);

    // 显示布局说明
    renderLayoutHint(layout);
  }

  function renderOnboarding(){
    const shown = State.get().meta.onboardingShown;
    const hasAny = Object.values(State.get().days).some(d=>Object.values(d.assignments).some(a=>a.text && a.text.trim()));
    els.onboardingBanner.hidden = shown || hasAny;
  }

  function renderModeUI(){
    const isClassroom = State.get().settings.mode === 'classroom';
    els.app.dataset.mode = isClassroom ? 'classroom' : 'edit';
    document.getElementById('modeIcon').innerHTML = isClassroom ? ICONS.classroom : ICONS.edit;
    document.getElementById('modeToggleBtn').title = isClassroom ? '返回编辑模式 (E)' : '打开独立教室模式 (E)';
    document.getElementById('modeToggleBtn').setAttribute('aria-pressed', String(isClassroom));
  }

  function renderThemeUI(){
    const theme = State.get().settings.theme;
    const icon = theme==='light'?ICONS.sun:theme==='dark'?ICONS.moon:ICONS.auto;
    document.getElementById('themeIcon').innerHTML = icon;
    document.getElementById('themeToggleBtn').title = `外观：${theme==='light'?'浅色':theme==='dark'?'深色':'跟随系统'}`;
    applyTheme();
  }
  function applyTheme(){
    const theme = State.get().settings.theme;
    const root = document.documentElement;
    if(theme === 'system'){
      const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      root.setAttribute('data-theme', dark?'dark':'light');
    }else{
      root.setAttribute('data-theme', theme);
    }
  }

  let onClassroomRerender = null;
  function setClassroomRerender(fn){ onClassroomRerender = fn; }

  function renderAll(){
    renderClock(new Date());
    renderQuote();
    renderDateBar();
    renderStatus();
    renderNote();
    renderGrid();
    renderOnboarding();
    renderModeUI();
    renderThemeUI();
    // 教室模式：内容变化后重测布局
    if(State.get().settings.mode === 'classroom' && onClassroomRerender) {
      requestAnimationFrame(()=>onClassroomRerender());
    }
  }

  return { renderClock, renderQuote, renderDateBar, renderStatus, renderNote, renderGrid,
           renderOnboarding, renderModeUI, renderThemeUI, applyTheme, renderAll, scheduleLayout,
           setClassroomRerender,
           visibleSubjects, currentDayRecord, els };
})();

/* ============================== 11.5 作业子项（多子项拆分）辅助 ============================== */
// 每门作业可由若干独立子项组成。items 为真源；text/completed 为兼容旧字段（派生）。
function subjectItems(rec){
  if(rec && Array.isArray(rec.items) && rec.items.length) return rec.items;
  return [{ text:(rec&&rec.text)||'', completed:!!(rec&&rec.completed), completedAt:(rec&&rec.completedAt)||null }];
}
function itemsDoneCount(items){ return items.filter(i=>i.completed).length; }
function itemsAllDone(items){ return items.length>0 && items.every(i=>i.completed); }
// 将 items 同步回旧字段，确保未升级的读取方（及导出/搜索）仍可工作
function syncLegacyFromItems(rec){
  const items = subjectItems(rec);
  rec.text = items.map(i=>(i.text||'').trim()).filter(Boolean).join('\n');
  rec.completed = itemsAllDone(items);
  if(rec.completed){
    rec.completedAt = items.reduce((m,i)=> (i.completedAt && (!m || i.completedAt>m)) ? i.completedAt : m, null);
  } else {
    rec.completedAt = null;
  }
}

/* ============================== 11.7 分享图生成（编辑模式） ============================== */
// 根据当天作业，用 Canvas 重绘一张简约美观的分享图（非 DOM 截屏），并下载为 PNG。
// 教室模式不可用：按钮已在教室模式下经 CSS 隐藏。
const ShareImage = (() => {
  const W = 1080;          // 逻辑宽度
  const PAD = 72;          // 外边距
  const SCALE = 2;         // 2x 高清
  const FONT = "'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC',sans-serif";
  const C = {
    bgTop:'#eef2fb', bgBot:'#e6ebf7',
    card:'#ffffff', shadow:'rgba(40,60,120,.14)',
    ink:'#1f2433', inkSoft:'#3a4156', muted:'#9aa3b8',
    accent:'#3454D1', accentSoft:'#e8ecfb', line:'#eceef5'
  };

  function roundRect(ctx,x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  // 在已设置好字体的 ctx 上按最大宽度逐字换行（兼容 emoji/中英混排）
  function wrap(ctx, text, maxW){
    const out=[]; let cur='';
    const chars = Array.from(text||'');
    for(const ch of chars){
      if(cur && ctx.measureText(cur+ch).width > maxW){ out.push(cur); cur=ch; }
      else cur+=ch;
    }
    if(cur) out.push(cur);
    return out.length ? out : [''];
  }

  function buildData(){
    const key = DateEngine.getViewingKey();
    const d = Utils.keyToDate(key);
    const day = Renderer.currentDayRecord();
    const subs = Renderer.visibleSubjects();
    let subjects = subs.map(s=>{
      const rec = day.assignments[s.id];
      const items = subjectItems(rec).map(i=>({
        text: (i.text && i.text.trim()) ? i.text : '暂无作业',
        done: !!i.completed,
        empty: !(i.text && i.text.trim())
      }));
      return { name:s.name, items };
    });
    if(!subjects.length) subjects = [{ name:'', items:[{ text:'今天还没有布置作业～', done:false, empty:true }] }];
    return {
      key,
      dateLabel:`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`,
      weekday: Utils.WEEKDAYS[d.getDay()],
      subjects
    };
  }

  function generate(){
    const data = buildData();
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    const contentW = W - PAD*2;
    const headH = 158;
    const nameH = 50, nameGap = 16, itemBase = 58, lineH = 30, itemGap = 10, blockGap = 34, footerH = 64;

    // —— 测量阶段（identity 变换，保证逻辑像素宽度准确）——
    ctx.font = `600 30px ${FONT}`; // 子项正文字号，用于换行测量
    const blocks = data.subjects.map(sub=>{
      const measured = sub.items.map(it=>{
        const lines = wrap(ctx, it.text, contentW - 44 - 26).map(t=>({ t, w: ctx.measureText(t).width }));
        const h = itemBase + (lines.length-1)*lineH;
        return { it, lines, h };
      });
      const blockH = nameH + nameGap + measured.reduce((a,m)=>a+m.h,0) + (sub.items.length-1)*itemGap;
      return { sub, measured, blockH };
    });

    let curY = PAD + headH + 24;
    blocks.forEach(b=>{ curY += b.blockH + blockGap; });
    const H = curY + footerH;

    // —— 绘制阶段（2x 高清）——
    canvas.width = W*SCALE; canvas.height = H*SCALE;
    ctx.setTransform(SCALE,0,0,SCALE,0,0);

    // 背景渐变
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,C.bgTop); g.addColorStop(1,C.bgBot);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    // 白色卡片 + 柔和投影
    const cardX=PAD-24, cardY=PAD-24, cardW=W-(PAD-24)*2, cardH=H-(PAD-24)*2;
    ctx.save();
    ctx.shadowColor=C.shadow; ctx.shadowBlur=44; ctx.shadowOffsetY=20;
    ctx.fillStyle=C.card; roundRect(ctx,cardX,cardY,cardW,cardH,28); ctx.fill();
    ctx.restore();

    ctx.textBaseline='alphabetic';

    // 头部
    let y = PAD;
    ctx.fillStyle=C.accent; ctx.font=`800 28px ${FONT}`;
    ctx.fillText('今课', PAD, y+30);
    ctx.fillStyle=C.muted; ctx.font=`600 22px ${FONT}`;
    ctx.fillText('Nowledge', PAD+58, y+30);
    ctx.fillStyle=C.accent; roundRect(ctx,PAD,y+44,38,5,3); ctx.fill();   // 品牌短下划线
    ctx.fillStyle=C.ink; ctx.font=`800 66px ${FONT}`;
    ctx.fillText(data.dateLabel, PAD, y+128);
    ctx.fillStyle=C.accent; ctx.font=`700 34px ${FONT}`;
    ctx.textAlign='right';
    ctx.fillText(data.weekday, W-PAD, y+120);
    ctx.textAlign='left';
    ctx.strokeStyle=C.line; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(PAD, y+headH); ctx.lineTo(W-PAD, y+headH); ctx.stroke();

    // 主体：学科 + 子项
    y = y + headH + 24;
    blocks.forEach(block=>{
      const { sub, measured } = block;
      if(sub.name){
        ctx.fillStyle=C.accent; roundRect(ctx,PAD,y,6,nameH-6,3); ctx.fill();
        ctx.fillStyle=C.ink; ctx.font=`800 40px ${FONT}`;
        ctx.fillText(sub.name, PAD+20, y+nameH-12);
      }
      y += nameH + nameGap;
      measured.forEach(m=>{
        const { it, lines, h } = m;
        const cx = PAD+16, cy = y + 19, boxR = 13;
        ctx.beginPath(); ctx.arc(cx,cy,boxR,0,Math.PI*2);
        if(it.done){ ctx.fillStyle=C.accent; ctx.fill(); }
        else { ctx.fillStyle='#fff'; ctx.fill(); }
        ctx.lineWidth=2.6; ctx.strokeStyle = it.done ? C.accent : (it.empty?C.line:C.muted); ctx.stroke();
        if(it.done){
          ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.lineCap='round'; ctx.lineJoin='round';
          ctx.beginPath();
          ctx.moveTo(cx-6,cy); ctx.lineTo(cx-1.5,cy+5); ctx.lineTo(cx+7,cy-6);
          ctx.stroke();
        }
        ctx.font=`600 30px ${FONT}`;
        let ty = cy - 5;
        lines.forEach(line=>{
          ctx.fillStyle = it.empty ? C.muted : (it.done ? C.muted : C.inkSoft);
          ctx.fillText(line.t, PAD+44, ty);
          if(it.done){
            ctx.strokeStyle=C.muted; ctx.lineWidth=1.5;
            ctx.beginPath(); ctx.moveTo(PAD+44, ty-10); ctx.lineTo(PAD+44+line.w, ty-10); ctx.stroke();
          }
          ty += lineH;
        });
        y += h + itemGap;
      });
      y += blockGap - itemGap;
    });

    // 页脚
    let total=0, done=0;
    data.subjects.forEach(s=>s.items.forEach(it=>{ if(!it.empty){ total++; if(it.done) done++; } }));
    ctx.fillStyle=C.muted; ctx.font=`500 22px ${FONT}`;
    ctx.fillText('由 今课 Nowledge 生成', PAD, H-PAD+18);
    ctx.textAlign='right';
    ctx.fillText(`${total} 项 · 已完成 ${done}`, W-PAD, H-PAD+18);
    ctx.textAlign='left';

    // 下载（同步 dataURL，处于用户手势内，最稳妥）
    const dataURL = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = dataURL; a.download = `今课Nowledge-${data.key}.png`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
  }

  return { generate };
})();

/* ============================== 11.8 AI 服务（OpenAI 兼容） ============================== */
// 多 AI 配置管理 + 调用 OpenAI 兼容 /v1/chat/completions（支持流式 SSE）。
// 密钥仅存于本机 localStorage，直接发往用户填写的服务商接口。
const AIService = (() => {
  function getAi(){ return State.get().ai; }
  function list(){ return (getAi().list || []).slice(); }
  function getActive(){
    const ai = getAi();
    if(!ai || !ai.enabled) return null;
    const found = (ai.list||[]).find(x=>x.id===ai.activeId);
    return found || null;
  }
  function add(cfg){
    const item = {
      id: Utils.uid('ai'),
      name: (cfg.name||'未命名').trim(),
      baseURL: (cfg.baseURL||'').trim().replace(/\/+$/,''),
      apiKey: (cfg.apiKey||'').trim(),
      model: (cfg.model||'').trim(),
      authHeader: cfg.authHeader || (cfg.auth==='apikey' ? 'api-key' : 'Authorization'),
      authScheme: (cfg.authScheme != null) ? cfg.authScheme : (cfg.auth==='apikey' ? '' : 'Bearer '),
      proxy: (cfg.proxy||'').trim(),
      createdAt: Date.now()
    };
    State.set(s=>{ s.ai.list.push(item); if(!s.ai.activeId) s.ai.activeId = item.id; }, 'ai');
    return item;
  }
  function update(id, cfg){
    State.set(s=>{
      const it = s.ai.list.find(x=>x.id===id);
      if(!it) return;
      if(cfg.name!==undefined) it.name = cfg.name.trim();
      if(cfg.baseURL!==undefined) it.baseURL = cfg.baseURL.trim().replace(/\/+$/,'');
      if(cfg.apiKey!==undefined) it.apiKey = cfg.apiKey.trim();
      if(cfg.model!==undefined) it.model = cfg.model.trim();
      if(cfg.authHeader!==undefined) it.authHeader = cfg.authHeader;
      if(cfg.authScheme!==undefined) it.authScheme = cfg.authScheme;
      if(cfg.proxy!==undefined) it.proxy = (cfg.proxy||'').trim();
    }, 'ai');
  }
  function remove(id){
    State.set(s=>{
      s.ai.list = s.ai.list.filter(x=>x.id!==id);
      if(s.ai.activeId===id) s.ai.activeId = s.ai.list.length ? s.ai.list[0].id : null;
    }, 'ai');
  }
  function setActive(id){ State.set(s=>{ s.ai.activeId = id; }, 'ai'); }
  function setEnabled(v){ State.set(s=>{ s.ai.enabled = !!v; }, 'ai'); }

  function buildMessages(kind, payload){
    const sys = {
      polishAndSplit: '你是作业整理助手。把用户给出的作业内容润色为书面、简洁、条理清晰的中文，并拆分为若干相互独立的要点。每行只输出一条要点，最多 10 条；不要编号、不要引号、不要 JSON、不要 markdown、不要解释。若内容本身已是清单则直接整理。',
      polish: '你是作业润色助手。请在不改变原意的前提下，把用户给出的这一条作业内容润色得更书面、简洁、易读。只返回润色后的一句文本，不要解释、不要引号、不要 markdown。'
    }[kind];
    const user = payload.text;
    return [ { role:'system', content: sys }, { role:'user', content: user } ];
  }

  // 调用；传入 onToken 则走流式（返回累积全文），否则返回完整 message.content
  // cfg 可显式传入一份临时配置（连通性测试用），此时既不读取也不修改全局 State。
  async function chat({ messages, onToken, temperature=0.4, signal, cfg: override }){
    const cfg = override || getActive();
    if(!cfg) throw new Error('未启用或未选择 AI，请先在「设置 → AI 设置」中配置并启用。');
    if(!cfg.baseURL) throw new Error('当前 AI 缺少 Base URL。');
    if(!cfg.model) throw new Error('当前 AI 缺少模型名称。');
    const realUrl = cfg.baseURL + '/chat/completions';
    let url = realUrl;
    if(cfg.proxy){
      url = cfg.proxy.indexOf('{url}') !== -1
        ? cfg.proxy.replace('{url}', encodeURIComponent(realUrl))
        : cfg.proxy.replace(/\/?$/, '/') + encodeURIComponent(realUrl);
    }
    const authHeader = cfg.authHeader || 'Authorization';
    const authScheme = (cfg.authScheme != null) ? cfg.authScheme : 'Bearer ';
    const headers = { 'Content-Type':'application/json' };
    if(cfg.apiKey) headers[authHeader] = authScheme + cfg.apiKey;
    const body = { model: cfg.model, messages, temperature, stream: !!onToken };

    let res;
    try{
      res = await fetch(url, { method:'POST', headers, body: JSON.stringify(body), signal });
    }catch(e){
      if(e && e.name === 'AbortError') throw new Error('请求超时或被取消，请检查网络与代理后重试。');
      const isProxy = !!cfg.proxy;
      throw new Error(isProxy
        ? '请求经代理仍失败（' + (e && e.message ? e.message : e) + '）。请检查代理地址是否可用、能否转发 POST 与请求头。'
        : '网络/跨域被拦截（Failed to fetch）。多数是浏览器跨域(CORS)限制：该接口未返回允许跨域的响应头。请用「CORS 代理」转发，或改为服务端调用。');
    }
    if(!res.ok){
      let detail = '';
      try { detail = (await res.text()).slice(0,300); } catch(e){}
      if(res.status===401) throw new Error('API 密钥无效或缺失（401）。');
      if(res.status===404) throw new Error('接口路径不存在（404）：请确认 Base URL 含 /v1 且服务商支持 chat/completions。');
      if(res.status===429) throw new Error('请求过于频繁或被限流（429）。');
      throw new Error(`请求失败（${res.status}）：${detail || res.statusText}`);
    }

    if(onToken && res.body){
      const reader = res.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buf = '', acc = '', sawData = false;
      while(true){
        const { done, value } = await reader.read();
        if(done) break;
        buf += decoder.decode(value, { stream:true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for(const line of lines){
          const t = line.trim();
          if(!t.startsWith('data:')) continue;
          const data = t.slice(5).trim();
          if(data==='[DONE]') continue;
          sawData = true;
          try{
            const json = JSON.parse(data);
            const delta = json.choices && json.choices[0] && json.choices[0].delta;
            if(delta && delta.content){ acc += delta.content; onToken(delta.content); }
          }catch(e){ /* 跳过不完整分片 */ }
        }
      }
      // 服务端未走 SSE：把整段当作非流式 JSON 兜底解析
      if(!sawData && buf){
        try{
          const json = JSON.parse(buf);
          const content = json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content;
          if(content && !acc){ acc = content; onToken(content); }
        }catch(e){}
      }
      return acc;
    }
    const json = await res.json();
    return json.choices && json.choices[0] && json.choices[0].message ? json.choices[0].message.content : '';
  }

  // 结构化解析：JSON 数组 → 提取 [...] → 逐行降级
  function parsePoints(raw){
    let text = (raw||'').trim();
    if(!text) return [];
    text = text.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/i,'').trim();
    try{ const a=JSON.parse(text); if(Array.isArray(a)) return a.map(x=>String(x).trim()).filter(Boolean); }catch(e){}
    const m = text.match(/\[[\s\S]*\]/);
    if(m){ try{ const a=JSON.parse(m[0]); if(Array.isArray(a)) return a.map(x=>String(x).trim()).filter(Boolean); }catch(e){} }
    return text.split(/\r?\n/).map(l=>l.replace(/^[\s\d]+[.、)]\s*/, '').replace(/^[-•*]\s*/, '').trim()).filter(Boolean);
  }

  // 分点结果必须是完整结构才能解析，流式没有任何「提前可用」的收益：
  // 反而多了 SSE 逐块传输、代理缓冲、逐 token 重绘的开销，且卡住时无法收尾。
  // 改为一次性取回；parsePoints 同时兼容纯行输出与旧版 JSON 数组输出。
  async function polishAndSplit(text, subject, { signal } = {}){
    const out = await chat({ messages: buildMessages('polishAndSplit', { text, subject }), signal });
    return out || '';
  }
  async function polish(text, { signal } = {}){
    const out = await chat({ messages: buildMessages('polish', { text }), signal });
    return (out||'').trim();
  }
  // 用一份（未必已保存的）配置做一次连通性测试，返回模型回复文本。
  // 关键：全程不触碰 State —— 旧实现会把 __test__ 临时塞进 ai.list 并改写
  // activeId/enabled，既可能被 debounce 持久化成幽灵配置，也会在并发测试时
  // 互相覆盖导致 activeId 悬空、AI 整体失效。现在改为显式传 cfg 给 chat()。
  async function testConnection(cfg){
    const temp = {
      baseURL:(cfg.baseURL||'').trim().replace(/\/+$/,''),
      apiKey:(cfg.apiKey||'').trim(),
      model:(cfg.model||'').trim(),
      authHeader:(cfg.authHeader || (cfg.auth==='apikey' ? 'api-key' : 'Authorization')),
      authScheme:(cfg.authScheme != null ? cfg.authScheme : (cfg.auth==='apikey' ? '' : 'Bearer ')),
      proxy:(cfg.proxy||'').trim()
    };
    if(!temp.baseURL) throw new Error('缺少 Base URL。');
    if(!temp.model) throw new Error('缺少模型名称。');
    const ac = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    const timer = ac ? setTimeout(()=>ac.abort(), 20000) : null;
    try{
      const out = await chat({
        messages: buildMessages('polish', { text:'把“写作业”润色成一句通顺的话。' }),
        cfg: temp,
        signal: ac ? ac.signal : undefined
      });
      return (out||'').trim() || 'OK';
    } finally {
      if(timer) clearTimeout(timer);
    }
  }

  return { getActive, list, add, update, remove, setActive, setEnabled,
           chat, parsePoints, polishAndSplit, polish, testConnection };
})();

/* ============================== 12. 业务动作 Actions ============================== */
const Actions = (() => {
  function toggleComplete(subjectId){
    const key = DateEngine.getViewingKey();
    State.set(()=>{
      const day = State.ensureDay(key);
      const rec = day.assignments[subjectId];
      const items = subjectItems(rec);
      const allDone = itemsAllDone(items);
      const now = Utils.formatDateLine(new Date()).time.slice(0,5);
      items.forEach(it=>{ it.completed = !allDone; it.completedAt = it.completed ? now : null; });
      rec.items = items;
      syncLegacyFromItems(rec);
    }, 'toggle');
    Renderer.renderStatus();
    Renderer.renderGrid();
  }

  function toggleItemComplete(subjectId, index){
    const key = DateEngine.getViewingKey();
    State.set(()=>{
      const day = State.ensureDay(key);
      const rec = day.assignments[subjectId];
      const items = subjectItems(rec);
      const it = items[index];
      if(!it) return;
      it.completed = !it.completed;
      it.completedAt = it.completed ? Utils.formatDateLine(new Date()).time.slice(0,5) : null;
      rec.items = items;
      syncLegacyFromItems(rec);
    }, 'toggle-item');
    Renderer.renderStatus();
    Renderer.renderGrid();
  }

  function saveAssignmentText(subjectId, text, opts={}){
    const key = DateEngine.getViewingKey();
    // 先 ensureDay 确保日记录存在，再在 State.set 内修改
    const day = State.ensureDay(key);
    State.set(()=>{
      const rec = day.assignments[subjectId];
      if(rec.items && rec.items.length){
        // 已拆分为多子项：沿用/清空作用于第 1 项，其余保持不变
        rec.items[0].text = text;
        rec.items[0].updatedAt = Date.now();
      } else {
        rec.text = text;
      }
      rec.updatedAt = Date.now();
      syncLegacyFromItems(rec);
    }, 'edit');
    // 输入过程中绝不重建卡片 DOM：保留 textarea、光标、选区和滚动位置。
    if(opts.render !== false){
      Renderer.renderStatus();
      Renderer.renderGrid();
      Renderer.renderOnboarding();
    }
  }

  function copyYesterday(){
    const key = DateEngine.getViewingKey();
    const yKey = Utils.addDays(key, -1);
    const yDay = State.get().days[yKey];
    if(!yDay){ Toast.show('昨天没有可复制的作业'); return; }
    const snapshot = JSON.parse(JSON.stringify(State.ensureDay(key).assignments));
    State.set(()=>{
      const day = State.ensureDay(key);
      Object.keys(day.assignments).forEach(sid=>{
        const src = yDay.assignments[sid];
        const has = src && (src.items ? src.items.some(i=>i.text && i.text.trim()) : (src.text && src.text.trim()));
        if(has){
          day.assignments[sid] = JSON.parse(JSON.stringify(src));
          day.assignments[sid].updatedAt = Date.now();
        }
      });
    }, 'copy');
    Renderer.renderGrid(); Renderer.renderStatus();
    Toast.show('已复制昨天的作业', { undo: ()=>{
      State.set(()=>{ State.get().days[key].assignments = snapshot; }, 'undo');
      Renderer.renderGrid(); Renderer.renderStatus();
    }});
  }

  function copySubjectFromYesterday(subjectId){
    const key = DateEngine.getViewingKey();
    const yKey = Utils.addDays(key, -1);
    const yDay = State.get().days[yKey];
    const src = yDay && yDay.assignments[subjectId];
    const has = src && (src.items ? src.items.some(i=>i.text && i.text.trim()) : (src.text && src.text.trim()));
    if(!has){ Toast.show('该学科昨天没有作业'); return; }
    State.set(()=>{
      const day = State.ensureDay(key);
      day.assignments[subjectId] = JSON.parse(JSON.stringify(src));
      day.assignments[subjectId].updatedAt = Date.now();
      syncLegacyFromItems(day.assignments[subjectId]);
    }, 'copy');
    Renderer.renderGrid(); Renderer.renderStatus(); Renderer.renderOnboarding();
    Toast.show('已沿用昨天的内容');
  }

  function clearAssignment(subjectId){
    const day = State.ensureDay(DateEngine.getViewingKey());
    const rec = day.assignments[subjectId];
    const prev = JSON.parse(JSON.stringify(rec));
    const hasContent = rec.items ? rec.items.some(i=>i.text && i.text.trim()) : (rec.text && rec.text.trim());
    if(!hasContent){ saveAssignmentText(subjectId, ''); return; }
    State.set(()=>{
      const blank = JSON.parse(JSON.stringify(prev));
      if(blank.items && blank.items.length){
        blank.items.forEach(i=>{ i.text=''; i.completed=false; i.completedAt=null; });
      } else {
        blank.text='';
      }
      day.assignments[subjectId] = blank;
      syncLegacyFromItems(day.assignments[subjectId]);
    }, 'clear');
    Renderer.renderGrid(); Renderer.renderStatus(); Renderer.renderOnboarding();
    Toast.show('已清空该学科作业', { undo: ()=>{
      State.set(()=>{ day.assignments[subjectId] = prev; }, 'undo');
      Renderer.renderGrid(); Renderer.renderStatus(); Renderer.renderOnboarding();
    }});
  }

  function saveNote(text){
    const key = DateEngine.getViewingKey();
    State.set(()=>{ State.ensureDay(key).note = text; }, 'note');
  }

  function nextQuote(){
    const day = State.ensureDay(DateEngine.getViewingKey());
    State.set(()=>{ QuoteEngine.next(day); }, 'quote');
    Renderer.renderQuote();
  }

  function goToDate(key){
    if(noteDebounce) noteDebounce.flush();
    DateEngine.setViewingKey(key);
    State.ensureDay(key);
    State.persistNow();
    Renderer.renderAll();
  }
  function goRelative(delta){ goToDate(Utils.addDays(DateEngine.getViewingKey(), delta)); }
  function goToday(){ goToDate(DateEngine.todayKey()); }

  function toggleMode(){ ClassroomManager.open(); }
  function cycleTheme(){
    const order = ['system','light','dark'];
    State.set(s=>{ s.settings.theme = order[(order.indexOf(s.settings.theme)+1)%order.length]; }, 'theme');
    Renderer.renderThemeUI();
  }

  return { toggleComplete, toggleItemComplete, saveAssignmentText, copyYesterday, copySubjectFromYesterday,
           clearAssignment, saveNote, nextQuote, goToDate, goRelative, goToday, toggleMode, cycleTheme };
})();

/* ============================== 13. 卡片交互 & 编辑对话框 ============================== */
const CardInteraction = (() => {
  let openMenuEl = null;

  function closeMenu(){
    if(openMenuEl){ openMenuEl.remove(); openMenuEl = null; }
    document.querySelectorAll('.card__menu-btn.is-open').forEach(b=>b.classList.remove('is-open'));
  }

  function bind(){
    Renderer.els.grid.addEventListener('click', (e)=>{
      const menuBtn = e.target.closest('.card__menu-btn');
      const checkBtn = e.target.closest('.card__check');
      const itemCheck = e.target.closest('.card__item-check');
      const card = e.target.closest('.card');
      if(!card) return;
      const subjectId = card.dataset.subjectId;
      if(menuBtn){ e.stopPropagation(); openCardMenu(menuBtn, subjectId); return; }
      if(itemCheck){ e.stopPropagation(); Actions.toggleItemComplete(subjectId, Number(itemCheck.dataset.item)); return; }
      if(checkBtn){ e.stopPropagation(); Actions.toggleComplete(subjectId); return; }
      if(State.get().settings.mode === 'edit'){ openEditDialog(subjectId); }
    });
    Renderer.els.grid.addEventListener('keydown', (e)=>{
      const card = e.target.closest('.card');
      if(!card) return;
      if((e.key==='Enter'||e.key===' ') && State.get().settings.mode==='edit'){
        e.preventDefault();
        openEditDialog(card.dataset.subjectId);
      }
    });
    document.addEventListener('click', (e)=>{ if(!e.target.closest('.menu') && !e.target.closest('.card__menu-btn')) closeMenu(); });
    window.addEventListener('scroll', closeMenu, true);
  }

  function subjectName(id){
    const s = State.get().subjects.find(x=>x.id===id);
    return s ? s.name : '';
  }

  function openCardMenu(btn, subjectId){
    closeMenu();
    btn.classList.add('is-open');
    const rect = btn.getBoundingClientRect();
    const menu = document.createElement('div');
    menu.className = 'menu';
    const day = Renderer.currentDayRecord();
    const rec = day.assignments[subjectId];
    menu.innerHTML = `
      <button class="menu__item" data-act="edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>编辑作业</button>
      <button class="menu__item" data-act="toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12l5 5 11-11"/></svg>${rec.completed?'标记为未完成':'标记为已完成'}</button>
      <button class="menu__item" data-act="copyYesterday"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 8V5a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-3"/><rect x="4" y="8" width="12" height="13" rx="1"/></svg>沿用昨天内容</button>
      <div class="menu__sep"></div>
      <button class="menu__item menu__item--danger" data-act="clear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 6"/></svg>清空该科作业</button>
    `;
    document.body.appendChild(menu);
    const menuW = menu.offsetWidth, menuH = menu.offsetHeight;
    let left = Math.min(rect.left, window.innerWidth - menuW - 12);
    let top = rect.bottom + 6;
    if(top + menuH > window.innerHeight - 8) top = rect.top - menuH - 6;
    menu.style.left = Math.max(8,left)+'px';
    menu.style.top = Math.max(8,top)+'px';
    menu.addEventListener('click', (e)=>{
      const act = e.target.closest('[data-act]');
      if(!act) return;
      const a = act.dataset.act;
      if(a==='edit') openEditDialog(subjectId);
      else if(a==='toggle') Actions.toggleComplete(subjectId);
      else if(a==='copyYesterday') Actions.copySubjectFromYesterday(subjectId);
      else if(a==='clear') Actions.clearAssignment(subjectId);
      closeMenu();
    });
    openMenuEl = menu;
  }

  function openEditDialog(subjectId){
    closeMenu();
    const day = Renderer.currentDayRecord();
    const rec = day.assignments[subjectId];
    let items = subjectItems(rec).map(i=>({text:i.text||'', completed:!!i.completed, completedAt:i.completedAt||null}));
    const yKey = Utils.addDays(DateEngine.getViewingKey(), -1);
    const yDay = State.get().days[yKey];
    const yRec = yDay && yDay.assignments[subjectId];
    const hasYesterday = yRec && (yRec.items ? yRec.items.some(i=>i.text&&i.text.trim()) : (yRec.text&&yRec.text.trim()));

    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="ai-assist" id="aiAssist">
        <div class="ai-assist__head" id="aiAssistHead">
          <span class="ai-assist__title">✨ AI 助手</span>
          <button class="ai-assist__toggle" id="aiAssistToggle" type="button">展开</button>
        </div>
        <div class="ai-assist__body" id="aiAssistBody" hidden>
          <textarea class="field__textarea ai-assist__input" id="aiInput" placeholder="把一大段作业内容粘到这里，AI 会润色并自动拆成多个要点。"></textarea>
          <div class="ai-assist__btns">
            <button class="btn btn--primary" id="aiSplitBtn" type="button">润色并分点</button>
            <button class="btn btn--secondary" id="aiFillBtn" type="button">填入当前内容</button>
          </div>
          <div class="ai-assist__status" id="aiStatus" hidden></div>
        </div>
      </div>
      <div class="split-control">
        <span class="split-control__label">拆分为独立项数</span>
        <div class="stepper">
          <button class="stepper__btn" id="splitMinus" type="button" aria-label="减少项数">−</button>
          <span class="stepper__value" id="splitValue">${items.length}</span>
          <button class="stepper__btn" id="splitPlus" type="button" aria-label="增加项数">+</button>
        </div>
      </div>
      <div class="items-editor" id="itemsEditor"></div>
    `;
    const itemsEditor = wrap.querySelector('#itemsEditor');
    const splitValue = wrap.querySelector('#splitValue');
    const debouncedRender = Utils.debounce(()=>{
      Renderer.renderGrid(); Renderer.renderStatus(); Renderer.renderOnboarding();
    }, 200);

    function saveItems(){
      State.set(()=>{
        const d = Renderer.currentDayRecord();
        const r = d.assignments[subjectId];
        r.items = items.map(i=>({text:i.text||'', completed:!!i.completed, completedAt:i.completedAt||null}));
        syncLegacyFromItems(r);
      }, 'edit');
      debouncedRender();
    }

    function renderItems(){
      itemsEditor.innerHTML = items.map((it, idx)=>`
        <div class="item-edit${it.completed?' is-done':''}" data-idx="${idx}">
          <div class="item-edit__head">
            <span class="item-edit__no">${idx+1}</span>
            <label class="item-edit__done"><input type="checkbox" data-idx="${idx}" ${it.completed?'checked':''}> 本项完成</label>
            <button class="item-edit__ai" data-ai-polish="${idx}" type="button" title="AI 润色这条">✨ 润色</button>
          </div>
          <textarea class="field__textarea item-edit__input" data-idx="${idx}" placeholder="第 ${idx+1} 项内容…"${idx===0?' data-autofocus':''}>${Utils.escapeHtml(it.text||'')}</textarea>
        </div>`).join('');
      itemsEditor.querySelectorAll('.item-edit__input').forEach(ta=>{
        const idx = Number(ta.dataset.idx);
        const resize = ()=>{ ta.style.height='auto'; ta.style.height=Math.max(56,Math.min(260,ta.scrollHeight))+'px'; };
        requestAnimationFrame(resize);
        ta.addEventListener('input', ()=>{ resize(); items[idx].text = ta.value; saveItems(); });
      });
      itemsEditor.querySelectorAll('.item-edit__done input').forEach(cb=>{
        cb.addEventListener('change', ()=>{
          const idx = Number(cb.dataset.idx);
          items[idx].completed = cb.checked;
          items[idx].completedAt = cb.checked ? Utils.formatDateLine(new Date()).time.slice(0,5) : null;
          itemsEditor.querySelectorAll('.item-edit')[idx].classList.toggle('is-done', cb.checked);
          saveItems();
        });
      });
    }

    wrap.querySelector('#splitMinus').addEventListener('click', ()=>{
      if(items.length>1){ items.pop(); splitValue.textContent = items.length; renderItems(); saveItems(); }
    });
    wrap.querySelector('#splitPlus').addEventListener('click', ()=>{
      if(items.length<10){ items.push({text:'',completed:false,completedAt:null}); splitValue.textContent = items.length; renderItems(); saveItems(); }
    });

    renderItems();

    // —— AI 助手 ——
    const aiAssist = wrap.querySelector('#aiAssist');
    const aiBody = wrap.querySelector('#aiAssistBody');
    const aiToggle = wrap.querySelector('#aiAssistToggle');
    const aiInput = wrap.querySelector('#aiInput');
    const aiStatus = wrap.querySelector('#aiStatus');
    const aiSplitBtn = wrap.querySelector('#aiSplitBtn');
    const aiFillBtn = wrap.querySelector('#aiFillBtn');

    function aiSetStatus(msg, kind){
      aiStatus.hidden = !msg;
      aiStatus.textContent = msg || '';
      aiStatus.className = 'ai-assist__status' + (kind?(' is-'+kind):'');
    }
    function aiActive(){ return AIService.getActive(); }
    function aiNoAI(){
      aiSetStatus('未启用 AI：请到「设置 → AI 设置」添加并启用一个 AI。', 'error');
    }
    if(!aiActive()){
      aiAssist.classList.add('is-disabled');
      aiSetStatus('未启用或未选择 AI，下方按钮暂不可用。', 'error');
    }
    aiToggle.addEventListener('click', ()=>{
      const show = aiBody.hidden;
      aiBody.hidden = !show;
      aiToggle.textContent = show ? '收起' : '展开';
    });
    aiFillBtn.addEventListener('click', ()=>{
      aiBody.hidden = false; aiToggle.textContent='收起';
      aiInput.value = items.map(i=>i.text).filter(t=>t&&t.trim()).join('\n');
      aiSetStatus('');
    });

    // 等待反馈由本地计时器驱动，与网络/代理是否吐字无关：即使模型无输出或代理缓冲，
    // 按钮和状态栏也每秒都在变；60s 自动超时，运行期间按钮变成「取消」可随时中止。
    const AI_TIMEOUT = 60000;
    async function aiRun(btn, fn){
      const prev = btn.textContent;
      const started = Date.now();
      const ac = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      let cancelled = false, done = false;
      const paint = (sec)=>{
        // 第一秒先禁用按钮，避免手抖双击把刚发起的请求直接取消掉
        btn.disabled = sec < 1;
        btn.textContent = sec < 1 ? '处理中…' : '取消 · ' + sec + 's';
        aiSetStatus('AI 正在润色并分点…（已等待 ' + sec + 's' + (sec < 1 ? '' : '，点上方按钮可取消') + '）', '');
      };
      paint(0);
      const ticker = setInterval(()=>{ if(!done) paint(Math.floor((Date.now()-started)/1000)); }, 1000);
      const guard = setTimeout(()=>{ if(ac) ac.abort(); }, AI_TIMEOUT);
      const onCancel = ()=>{ if(done) return; cancelled = true; if(ac) ac.abort(); };
      btn.addEventListener('click', onCancel);
      try{
        await fn(ac ? ac.signal : undefined);
      }catch(e){
        if(cancelled) aiSetStatus('已取消。', '');
        else if(ac && ac.signal.aborted) aiSetStatus('AI 请求超时（60s）：请检查网络、代理，或换用更快的模型。', 'error');
        else aiSetStatus('AI 出错：' + (e && e.message ? e.message : e), 'error');
      }finally{
        done = true;
        clearInterval(ticker); clearTimeout(guard);
        btn.removeEventListener('click', onCancel);
        btn.disabled = false; btn.textContent = prev;
      }
    }

    let aiSplitRunning = false;
    aiSplitBtn.addEventListener('click', ()=>{
      if(aiSplitRunning) return; // 运行期间的点击由 aiRun 里的「取消」接管
      aiSplitRunning = true;
      aiRun(aiSplitBtn, async (signal)=>{
        const cfg = aiActive(); if(!cfg){ aiNoAI(); return; }
        const text = aiInput.value.trim();
        if(!text){ aiSetStatus('请先在上方输入或粘贴作业内容。', 'error'); return; }
        const result = await AIService.polishAndSplit(text, subjectName(subjectId), { signal });
        const points = (result||'').trim() ? AIService.parsePoints(result) : [];
        if(!points.length){ aiSetStatus('AI 未返回有效要点，请重试或调整内容。', 'error'); return; }
        const truncated = points.length > 10;
        if(truncated) points.length = 10;
        items = points.map(p=>({text:p, completed:false, completedAt:null}));
        splitValue.textContent = items.length;
        renderItems(); saveItems();
        aiSetStatus('已生成 ' + items.length + ' 项要点' + (truncated ? '（超出 10 项的部分已截取）' : '') + '。', 'ok');
      }).finally(()=>{ aiSplitRunning = false; });
    });

    // 单条润色（事件委托在 itemsEditor 上，renderItems 重渲染不影响）
    itemsEditor.addEventListener('click', (e)=>{
      const b = e.target.closest('[data-ai-polish]'); if(!b) return;
      const idx = Number(b.dataset.aiPolish);
      const src = (items[idx].text||'').trim();
      if(!src){ Toast.show('这条内容为空，无法润色'); return; }
      const cfg = aiActive(); if(!cfg){ Toast.show('请先在设置中启用并选择 AI'); return; }
      const prevPolish = b.textContent;
      const ac = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      const guard = ac ? setTimeout(()=>ac.abort(), 30000) : null;
      b.disabled = true; b.textContent = '润色中…';
      AIService.polish(src, { signal: ac ? ac.signal : undefined }).then(out=>{
        const polished = (out||'').trim();
        if(!polished){ Toast.show('AI 未返回润色结果'); return; }
        items[idx].text = polished;
        const ta = itemsEditor.querySelector('.item-edit__input[data-idx="'+idx+'"]');
        if(ta){ ta.value = polished; ta.style.height='auto'; ta.style.height=Math.max(56,Math.min(260,ta.scrollHeight))+'px'; }
        saveItems();
        Toast.show('已润色');
      }).catch(err=>{ Toast.show('AI 出错：' + (err&&err.message?err.message:err)); })
        .finally(()=>{ if(guard) clearTimeout(guard); b.disabled=false; b.textContent=prevPolish; });
    });

    const actions = [
      {label:'完成', variant:'primary', onClick:()=>{ saveItems(); Dialog.close(); }}
    ];
    if(hasYesterday){
      actions.unshift({label:'沿用昨天', align:'left', onClick:()=>{
        const ys = yRec.items ? yRec.items : [{text:yRec.text||'',completed:false,completedAt:null}];
        items = ys.map(i=>({text:i.text||'',completed:!!i.completed,completedAt:i.completedAt||null}));
        splitValue.textContent = items.length;
        renderItems(); saveItems();
      }});
    }

    Dialog.open({
      title: subjectName(subjectId),
      bodyNode: wrap,
      actions,
      onClose: ()=>saveItems()
    });
  }

  return { bind, openEditDialog };
})();
