      card.className = 'card' + (mode==='edit'?' is-clickable':'') + (rec.completed?' is-done':'');
      card.setAttribute('role','listitem');
      card.dataset.subjectId = sub.id;
      card.tabIndex = mode==='edit' ? 0 : -1;
      const hasText = rec.text && rec.text.trim().length>0;
      const bodyText = hasText ? Utils.escapeHtml(rec.text) : (mode==='edit' ? '点击添加今天的作业' : '暂无作业');
      const metaText = rec.completed && rec.completedAt ? `完成于 ${rec.completedAt}` : (hasText? '' : '');
      card.innerHTML = `
        <div class="card__head">
          <span class="card__title">${sub.custom?'<span class="card__custom-dot" title="自定义学科"></span>':''}${Utils.escapeHtml(sub.name)}</span>
          <button class="card__check" aria-label="标记完成" title="标记完成/未完成"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l5 5 11-11"/></svg></button>
        </div>
        <div class="card__body${hasText?'':' is-empty'}">${bodyText}</div>
        <div class="card__foot">
          <span class="card__meta">${metaText}</span>
          <button class="card__menu-btn" aria-label="更多操作" title="更多操作">${subjectMenuIcon()}</button>
        </div>`;
      els.grid.appendChild(card);
    });

    scheduleLayout();
  }

  function scheduleLayout(){
    if(layoutRaf) cancelAnimationFrame(layoutRaf);
    layoutRaf = requestAnimationFrame(applyLayout);
  }
  function applyLayout(){
    const day = currentDayRecord();
    const subs = visibleSubjects();
    if(!subs.length) return;
    const items = subs.map(s=>({ text: (day.assignments[s.id] && day.assignments[s.id].text) || '' }));
    // 使用完整文本内容作为签名的一部分，而非仅长度，避免因换行变化导致不重排
    const sig = els.gridWrap.clientWidth+'x'+window.innerHeight+'x'+items.map(i=>i.text.length+':'+i.text.substring(0,50)).join(',');
    if(sig === lastLayoutSig) return;
    lastLayoutSig = sig;
    const classroom = State.get().settings.mode === 'classroom';
    const layout = LayoutEngine.compute(els.gridWrap, els.grid, subs.length, classroom);
    els.grid.style.setProperty('--grid-gap', layout.gap+'px');
    els.grid.style.setProperty('--card-pad', layout.padding+'px');
    els.grid.style.setProperty('--card-title-size', layout.titleSize+'px');
    els.grid.style.setProperty('--card-body-size', layout.fontPx+'px');
    els.grid.style.gridTemplateColumns = `repeat(${layout.cols}, minmax(0,1fr))`;
    els.grid.classList.toggle('is-scrollable', layout.scroll);
    els.grid.dataset.cols = String(layout.cols);
    els.grid.dataset.density = layout.fontPx <= 13.5 ? 'compact' : layout.fontPx <= 14.5 ? 'dense' : 'comfortable';
    els.grid.setAttribute('aria-label', `今日作业 ${layout.cols} 列自适应布局${layout.scroll?'，内容较多可滚动':''}`);
  }

  function renderOnboarding(){
    const shown = State.get().meta.onboardingShown;
    const hasAny = Object.values(State.get().days).some(d=>Object.values(d.assignments).some(a=>a.text && a.text.trim()));
    els.onboardingBanner.hidden = shown || hasAny;
  }

  function renderModeUI(){
    const isClassroom = State.get().settings.mode === 'classroom';
    els.app.dataset.mode = isClassroom ? 'classroom' : 'edit';
    document.getElementById('modeIcon').innerHTML = isClassroom ? ICONS.classroom : ICONS.edit;
    document.getElementById('modeToggleBtn').title = isClassroom ? '返回编辑模式 (E)' : '打开独立教室模式 (E)';
    document.getElementById('modeToggleBtn').setAttribute('aria-pressed', String(isClassroom));
  }

  function renderThemeUI(){
    const theme = State.get().settings.theme;
    const icon = theme==='light'?ICONS.sun:theme==='dark'?ICONS.moon:ICONS.auto;
    document.getElementById('themeIcon').innerHTML = icon;
    document.getElementById('themeToggleBtn').title = `外观：${theme==='light'?'浅色':theme==='dark'?'深色':'跟随系统'}`;
    applyTheme();
  }
  function applyTheme(){
    const theme = State.get().settings.theme;
    const root = document.documentElement;
    if(theme === 'system'){
      const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      root.setAttribute('data-theme', dark?'dark':'light');
    }else{
      root.setAttribute('data-theme', theme);
    }
  }

  let onClassroomRerender = null;
  function setClassroomRerender(fn){ onClassroomRerender = fn; }

  function renderAll(){
    renderClock(new Date());
    renderQuote();
    renderDateBar();
    renderStatus();
    renderNote();
    renderGrid();
    renderOnboarding();
    renderModeUI();
    renderThemeUI();
    // 教室模式：内容变化后重测布局
    if(State.get().settings.mode === 'classroom' && onClassroomRerender) {
      requestAnimationFrame(()=>onClassroomRerender());
    }
  }

  return { renderClock, renderQuote, renderDateBar, renderStatus, renderNote, renderGrid,
           renderOnboarding, renderModeUI, renderThemeUI, applyTheme, renderAll, scheduleLayout,
           setClassroomRerender,
           visibleSubjects, currentDayRecord, els };
})();

/* ============================== 12. Actions ============================== */
const Actions = (() => {
  function toggleComplete(subjectId){
    const key = DateEngine.getViewingKey();
    State.set(()=>{
      const day = State.ensureDay(key);
      const rec = day.assignments[subjectId];
      rec.completed = !rec.completed;
      rec.completedAt = rec.completed ? Utils.formatDateLine(new Date()).time.slice(0,5) : null;
    }, 'toggle');
    Renderer.renderStatus();
    Renderer.renderGrid();
  }

  function saveAssignmentText(subjectId, text, opts={}){
    const key = DateEngine.getViewingKey();
    State.set(()=>{
      const day = State.ensureDay(key);
      day.assignments[subjectId].text = text;
      day.assignments[subjectId].updatedAt = Date.now();
    }, 'edit');
    if(opts.render !== false){
      Renderer.renderStatus();
      Renderer.renderGrid();
      Renderer.renderOnboarding();
    }
  }

  function copyYesterday(){
    const key = DateEngine.getViewingKey();
    const yKey = Utils.addDays(key, -1);
    const yDay = State.get().days[yKey];
    if(!yDay){ Toast.show('昨天没有可复制的作业'); return; }
    const snapshot = JSON.parse(JSON.stringify(State.ensureDay(key).assignments));
    State.set(()=>{
      const day = State.ensureDay(key);
      Object.keys(day.assignments).forEach(sid=>{
        const src = yDay.assignments[sid];
        if(src && src.text && src.text.trim()){
          day.assignments[sid].text = src.text;
          day.assignments[sid].updatedAt = Date.now();
        }
      });
    }, 'copy');
    Renderer.renderGrid(); Renderer.renderStatus();
    Toast.show('已复制昨天的作业', { undo: ()=>{
      State.set(()=>{ State.get().days[key].assignments = snapshot; }, 'undo');
      Renderer.renderGrid(); Renderer.renderStatus();
    }});
  }

  function copySubjectFromYesterday(subjectId){
    const key = DateEngine.getViewingKey();
    const yKey = Utils.addDays(key, -1);
    const yDay = State.get().days[yKey];
    const src = yDay && yDay.assignments[subjectId];
    if(!src || !src.text || !src.text.trim()){ Toast.show('该学科昨天没有作业'); return; }
    saveAssignmentText(subjectId, src.text);
    Toast.show('已沿用昨天的内容');
  }

  function clearAssignment(subjectId){
    const day = State.ensureDay(DateEngine.getViewingKey());
    const prev = day.assignments[subjectId].text;
    if(!prev || !prev.trim()){ saveAssignmentText(subjectId, ''); return; }
    saveAssignmentText(subjectId, '');
    Toast.show('已清空该学科作业', { undo: ()=>saveAssignmentText(subjectId, prev) });
  }

  function saveNote(text){
    const key = DateEngine.getViewingKey();
    State.set(()=>{ State.ensureDay(key).note = text; }, 'note');
  }

  function nextQuote(){
    const day = State.ensureDay(DateEngine.getViewingKey());
    State.set(()=>{ QuoteEngine.next(day); }, 'quote');
    Renderer.renderQuote();
  }

  function goToDate(key){
    if(noteDebounce) noteDebounce.flush();
    DateEngine.setViewingKey(key);
    State.ensureDay(key);
    State.persistNow();
    Renderer.renderAll();
  }
  function goRelative(delta){ goToDate(Utils.addDays(DateEngine.getViewingKey(), delta)); }
  function goToday(){ goToDate(DateEngine.todayKey()); }

  function toggleMode(){ ClassroomManager.open(); }
  function cycleTheme(){
    const order = ['system','light','dark'];
    State.set(s=>{ s.settings.theme = order[(order.indexOf(s.settings.theme)+1)%order.length]; }, 'theme');
    Renderer.renderThemeUI();
  }

  return { toggleComplete, saveAssignmentText, copyYesterday, copySubjectFromYesterday,
           clearAssignment, saveNote, nextQuote, goToDate, goRelative, goToday, toggleMode, cycleTheme };
})();

/* ============================== 13. CardInteraction ============================== */
const CardInteraction = (() => {
  let openMenuEl = null;

  function closeMenu(){
    if(openMenuEl){ openMenuEl.remove(); openMenuEl = null; }
    document.querySelectorAll('.card__menu-btn.is-open').forEach(b=>b.classList.remove('is-open'));
  }

  function bind(){
    Renderer.els.grid.addEventListener('click', (e)=>{
      const menuBtn = e.target.closest('.card__menu-btn');
      const checkBtn = e.target.closest('.card__check');
      const card = e.target.closest('.card');
      if(!card) return;
      const subjectId = card.dataset.subjectId;
      if(menuBtn){ e.stopPropagation(); openCardMenu(menuBtn, subjectId); return; }
      if(checkBtn){ e.stopPropagation(); Actions.toggleComplete(subjectId); return; }
      if(State.get().settings.mode === 'edit'){ openEditDialog(subjectId); }
    });
    Renderer.els.grid.addEventListener('keydown', (e)=>{
      const card = e.target.closest('.card');
      if(!card) return;
      if((e.key==='Enter'||e.key===' ') && State.get().settings.mode==='edit'){
        e.preventDefault();
        openEditDialog(card.dataset.subjectId);
      }
    });
    document.addEventListener('click', (e)=>{ if(!e.target.closest('.menu') && !e.target.closest('.card__menu-btn')) closeMenu(); });
    window.addEventListener('scroll', closeMenu, true);
  }

  function subjectName(id){
    const s = State.get().subjects.find(x=>x.id===id);
    return s ? s.name : '';
  }

  function openCardMenu(btn, subjectId){
    closeMenu();
    btn.classList.add('is-open');
    const rect = btn.getBoundingClientRect();
    const menu = document.createElement('div');
    menu.className = 'menu';
    const day = Renderer.currentDayRecord();
    const rec = day.assignments[subjectId];
    menu.innerHTML = `
      <button class="menu__item" data-act="edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>编辑作业</button>
      <button class="menu__item" data-act="toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12l5 5 11-11"/></svg>${rec.completed?'标记为未完成':'标记为已完成'}</button>
      <button class="menu__item" data-act="copyYesterday"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 8V5a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-3"/><rect x="4" y="8" width="12" height="13" rx="1"/></svg>沿用昨天内容</button>
      <div class="menu__sep"></div>
      <button class="menu__item menu__item--danger" data-act="clear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 6"/></svg>清空该科作业</button>
    `;
    document.body.appendChild(menu);
    const menuW = menu.offsetWidth, menuH = menu.offsetHeight;
    let left = Math.min(rect.left, window.innerWidth - menuW - 12);
    let top = rect.bottom + 6;
    if(top + menuH > window.innerHeight - 8) top = rect.top - menuH - 6;
    menu.style.left = Math.max(8,left)+'px';
    menu.style.top = Math.max(8,top)+'px';
    menu.addEventListener('click', (e)=>{
      const act = e.target.closest('[data-act]');
      if(!act) return;
      const a = act.dataset.act;
      if(a==='edit') openEditDialog(subjectId);
      else if(a==='toggle') Actions.toggleComplete(subjectId);
      else if(a==='copyYesterday') Actions.copySubjectFromYesterday(subjectId);
      else if(a==='clear') Actions.clearAssignment(subjectId);
      closeMenu();
    });
    openMenuEl = menu;
  }

  function openEditDialog(subjectId){
    closeMenu();
    const day = Renderer.currentDayRecord();
    const rec = day.assignments[subjectId];
    const yKey = Utils.addDays(DateEngine.getViewingKey(), -1);
    const yDay = State.get().days[yKey];
    const hasYesterday = yDay && yDay.assignments[subjectId] && yDay.assignments[subjectId].text.trim();

    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="field">
        <textarea class="field__textarea" id="assignInput" data-autofocus placeholder="输入今天的作业内容…支持换行"></textarea>
        <div class="field__save-state" id="saveState">已保存</div>
      </div>
      <div class="toggle-row">
        <div><div class="toggle-row__label">标记为已完成</div></div>
        <button class="switch" id="doneSwitch" role="switch" aria-checked="${rec.completed}"></button>
      </div>
    `;
    const ta = wrap.querySelector('#assignInput');
    ta.value = rec.text || '';
    const resizeEditor = ()=>{
      ta.style.height='auto';
      ta.style.height=Math.max(140,Math.min(420,ta.scrollHeight))+'px';
    };
    requestAnimationFrame(resizeEditor);
    const saveState = wrap.querySelector('#saveState');
    const doneSwitch = wrap.querySelector('#doneSwitch');

    const debouncedSave = Utils.debounce(()=>{
      const caretStart=ta.selectionStart, caretEnd=ta.selectionEnd, scrollTop=ta.scrollTop;
      Actions.saveAssignmentText(subjectId, ta.value, {render:false});
      ta.selectionStart=caretStart; ta.selectionEnd=caretEnd; ta.scrollTop=scrollTop;
      saveState.classList.add('is-visible');
      setTimeout(()=>saveState.classList.remove('is-visible'), 1200);
    }, 450);
    ta.addEventListener('input', ()=>{ resizeEditor(); debouncedSave(); });
    ta.addEventListener('keydown', e=>{
      if((e.metaKey||e.ctrlKey) && e.key==='Enter'){
        e.preventDefault();
        debouncedSave.flush();
        Renderer.renderGrid(); Renderer.renderStatus(); Renderer.renderOnboarding();
        Dialog.close();
      }
    });

    doneSwitch.addEventListener('click', ()=>{
      Actions.toggleComplete(subjectId);
      const nowRec = Renderer.currentDayRecord().assignments[subjectId];
      doneSwitch.setAttribute('aria-checked', nowRec.completed);
    });

    const actions = [
      {label:'完成', variant:'primary', onClick:()=>{ debouncedSave.flush(); Renderer.renderGrid(); Renderer.renderStatus(); Renderer.renderOnboarding(); Dialog.close(); }}
    ];
    if(hasYesterday){
      actions.unshift({label:'沿用昨天', align:'left', onClick:()=>{
        ta.value = yDay.assignments[subjectId].text;
        debouncedSave.flush();
      }});
    }

    Dialog.open({
      title: subjectName(subjectId),
      bodyNode: wrap,
      actions,
      onClose: ()=>{ debouncedSave.flush(); }
    });
  }

  return { bind, openEditDialog };
})();

    `;
    Dialog.open({ title:'设置', bodyNode: wrap, wide:true });

    const themeSeg = wrap.querySelector('#themeSeg');
    function syncSeg(){
      themeSeg.querySelectorAll('button').forEach(b=>b.classList.toggle('is-active', b.dataset.v===State.get().settings.theme));
    }
    syncSeg();
    themeSeg.addEventListener('click', e=>{

      Renderer.renderThemeUI(); syncSeg();
    });

    const autoSwitch = wrap.querySelector('#autoStartSwitch');
    autoSwitch.setAttribute('aria-checked', s.autoStartNext);
    autoSwitch.addEventListener('click', ()=>{
      State.set(st=>{ st.settings.autoStartNext = !st.settings.autoStartNext; }, 'settings');
      autoSwitch.setAttribute('aria-checked', State.get().settings.autoStartNext);
    });
    const soundSwitch = wrap.querySelector('#soundSwitch');
    soundSwitch.setAttribute('aria-checked', s.soundEnabled);
    soundSwitch.addEventListener('click', ()=>{
      State.set(st=>{ st.settings.soundEnabled = !st.settings.soundEnabled; }, 'settings');
      soundSwitch.setAttribute('aria-checked', State.get().settings.soundEnabled);
      FocusTimer.updateUI();
    });

    wrap.querySelector('#openSubjectsBtn').addEventListener('click', SubjectManager.open);

    // — 快捷键编辑器 —
    const RESERVERD_KEYS = new Set(['escape','enter','arrowup','arrowdown','arrowleft','arrowright','tab','space','delete','backspace','shift','control','alt','meta']);
    const SHORTCUT_DEF = [
      { key: 'e', action: '进入教室模式' },
      { key: 'f', action: '进入专注模式' },
      { key: 'n', action: '下一天' },
      { key: 'p', action: '上一天' },
    ];
    function renderShortcutEditor(){
      const container = wrap.querySelector('#shortcutEditor');
      if(!container) return;
      const shortcuts = State.get().settings.shortcuts || { e:'e', f:'f', n:'n', p:'p' };
      container.innerHTML = SHORTCUT_DEF.map(def => {
        const currentKey = (shortcuts[def.key] || def.key).toUpperCase();
        const isReserved = RESERVERD_KEYS.has(currentKey.toLowerCase());
        return `<div class="shortcut-item" style="gap:10px;">
          <span style="flex:1;font-size:13px;color:var(--ink-soft);">${def.action}</span>
          <kbd data-target="${def.key}" class="shortcut-kbd ${isReserved?'is-reserved':''}">${currentKey}</kbd>
        </div>`;
      }).join('');

      container.querySelectorAll('.shortcut-kbd').forEach(kbd => {
        kbd.addEventListener('click', ()=>{
          const targetKey = kbd.dataset.target;
          if(RESERVERD_KEYS.has(shortcuts[targetKey]||'')) return;
          kbd.textContent = '...';
          kbd.classList.add('is-listening');
          kbd.setAttribute('aria-label','按下新按键');

          const once = (e)=>{
            e.preventDefault();
            document.removeEventListener('keydown', once);
            const newKey = e.key.toLowerCase();
            if(RESERVERD_KEYS.has(newKey)){
              Toast.show('该按键已保留，请选择其他按键');
              kbd.textContent = (shortcuts[targetKey]||targetKey).toUpperCase();
              kbd.classList.remove('is-listening');
              return;
            }
            const conflict = SHORTCUT_DEF.find(d=>d.key!==targetKey && shortcuts[d.key]===newKey);
            if(conflict){
              Toast.show(`按键 "${newKey.toUpperCase()}" 已被「${conflict.action}」占用`);
              kbd.textContent = (shortcuts[targetKey]||targetKey).toUpperCase();
              kbd.classList.remove('is-listening');
              return;
            }
            State.set(st=>{ st.settings.shortcuts[targetKey] = newKey; }, 'settings');
            Shortcuts.rebind();
            kbd.textContent = newKey.toUpperCase();
            kbd.classList.remove('is-listening');
          };
          document.addEventListener('keydown', once, { once:false });
        });
      });
    }
    renderShortcutEditor();
    State.subscribe((kind)=>{ if(kind==='settings') renderShortcutEditor(); });

    function renderExams(){
      const list = wrap.querySelector('#examList');
      const exams = State.get().exams.slice().sort((a,b)=>a.date.localeCompare(b.date));
      list.innerHTML = exams.length ? exams.map(e=>`
        <div class="subject-manage-row" data-id="${e.id}">
          <span class="subject-manage-row__name">${Utils.escapeHtml(e.name)} <span style="color:var(--muted-2)">· ${e.date}</span></span>
          <button class="menu__item menu__item--danger" style="width:auto;padding:4px 8px;" data-act="delExam"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>`).join('') : '<div class="field__hint">暂无考试倒计时</div>';
    }
    renderExams();
    wrap.querySelector('#examList').addEventListener('click', e=>{
      const btn = e.target.closest('[data-act="delExam"]'); if(!btn) return;
      const id = btn.closest('[data-id]').dataset.id;
      State.set(st=>{ st.exams = st.exams.filter(x=>x.id!==id); }, 'exams');
      renderExams(); Renderer.renderStatus();
    });
    wrap.querySelector('#examAddBtn').addEventListener('click', ()=>{
      const name = wrap.querySelector('#examName').value.trim();
      const date = wrap.querySelector('#examDate').value;
      if(!name || !date){ Toast.show('请填写考试名称与日期'); return; }
      State.set(st=>{ st.exams.push({id:Utils.uid('exam'), name, date}); }, 'exams');
      wrap.querySelector('#examName').value=''; wrap.querySelector('#examDate').value='';
      renderExams(); Renderer.renderStatus();
    });

    wrap.querySelector('#exportBtn').addEventListener('click', ()=>{
      const data = JSON.stringify(State.get(), null, 2);
      Utils.download(`今课 Nowledge-南师附中-数据备份-${DateEngine.todayKey()}.json`, data);
      Toast.show('已导出 JSON 文件');
    });
    const fileInput = wrap.querySelector('#importFile');
    wrap.querySelector('#importBtn').addEventListener('click', ()=>fileInput.click());
    fileInput.addEventListener('change', ()=>{
      const file = fileInput.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const parsed = JSON.parse(reader.result);
          if(!Store.isValid(parsed)) throw new Error('结构不完整');
          Dialog.confirm({
            title:'确认导入', message:'导入将<b>覆盖</b>当前所有数据，此操作不可撤销，是否继续？',
            confirmLabel:'导入并覆盖', danger:true,
            onConfirm:()=>{
              State.replaceAll(parsed);
              Renderer.renderAll();
              Toast.show('数据已导入');
            }
          });
        }catch(e){
          Toast.show('导入失败：文件格式不正确');
        }
        fileInput.value = '';
      };
      reader.onerror = ()=>{ Toast.show('文件读取失败'); };
      reader.readAsText(file);
    });
    wrap.querySelector('#clearAllBtn').addEventListener('click', ()=>{
      Dialog.confirm({
        title:'清空所有数据', message:'将删除全部学科、历史作业与设置，恢复到初始状态。此操作<b>不可恢复</b>，是否继续？',
        confirmLabel:'清空所有数据', danger:true,
        onConfirm:()=>{
          State.resetAll();
          DateEngine.setViewingKey(DateEngine.todayKey());
          Renderer.renderAll();
          Toast.show('已清空所有数据');
        }
      });
    });
  }
  return { open };
})();

        <button class="btn btn--primary" id="addSubjectBtn">添加</button>
      </div>
      <details class="trash-section" id="trashSection">
        <summary>已删除的学科 <span id="trashCount"></span></summary>
        <div id="trashRows"></div>
      </details>`;
    Dialog.open({ title:'学科与顺序', bodyNode: wrap, wide:true });
    renderRows();

    function renderRows(){
      const subjects = State.get().subjects.filter(s=>!s.deletedAt).sort((a,b)=>a.order-b.order);
      const rowsEl = wrap.querySelector('#subjectRows');
      rowsEl.innerHTML = subjects.map((s,i)=>`
        <div class="subject-manage-row${s.enabled?'':' is-disabled'}" data-id="${s.id}">
          <div class="subject-manage-row__drag">
            <button data-act="up" ${i===0?'disabled':''} title="上移" aria-label="上移"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 15l-6-6-6 6"/></svg></button>
            <button data-act="down" ${i===subjects.length-1?'disabled':''} title="下移" aria-label="下移"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg></button>
          </div>
          <div class="subject-manage-row__name"><input value="${Utils.escapeHtml(s.name)}" data-act="rename" ${s.custom?'':'data-core="1"'}></div>
          ${s.custom?'<span class="subject-manage-row__badge">自定义</span>':''}
          <div class="subject-manage-row__actions">
            <button class="icon-btn" style="width:30px;height:30px;" data-act="toggle" title="${s.enabled?'隐藏':'显示'}" aria-label="${s.enabled?'隐藏学科':'显示学科'}">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8">${s.enabled?'<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>':'<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 7 11 7a21.6 21.6 0 0 1-2.61 3.66M1 1l22 22M9.5 9.5a3 3 0 0 0 4.24 4.24"/>'}</svg>
            </button>
            <button class="icon-btn" style="width:30px;height:30px;color:var(--danger);" data-act="delete" title="删除" aria-label="删除学科">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 6"/></svg>
            </button>
          </div>
        </div>`).join('');
      renderTrash();
    }
    function renderTrash(){
      const deleted = State.get().subjects.filter(s=>s.deletedAt);
      wrap.querySelector('#trashCount').textContent = deleted.length ? `(${deleted.length})` : '';
      wrap.querySelector('#trashRows').innerHTML = deleted.length ? deleted.map(s=>`
        <div class="subject-manage-row" data-id="${s.id}">
          <span class="subject-manage-row__name">${Utils.escapeHtml(s.name)}</span>
          <button class="btn btn--sm" data-act="restore">恢复</button>
        </div>`).join('') : '<div class="field__hint">暂无已删除学科</div>';
    }

    wrap.querySelector('#subjectRows').addEventListener('click', e=>{
      const row = e.target.closest('[data-id]'); if(!row) return;
      const id = row.dataset.id;
      const act = e.target.closest('[data-act]');
      if(!act) return;
      const subs = State.get().subjects;
      const s = subs.find(x=>x.id===id);
      if(act.dataset.act==='toggle'){
        State.set(()=>{ s.enabled = !s.enabled; }, 'subjects');
        renderRows(); Renderer.renderAll();
      }else if(act.dataset.act==='delete'){
        Dialog.confirm({
          title:'删除学科', message:`确定要删除「<b>${Utils.escapeHtml(s.name)}</b>」吗？删除后可在下方「已删除的学科」中恢复。`,
          confirmLabel:'删除', danger:true,
          onConfirm:()=>{
            State.set(()=>{ s.deletedAt = Date.now(); }, 'subjects');
            renderRows(); Renderer.renderAll();
            Toast.show(`已删除「${s.name}」`, { undo: ()=>{
              State.set(()=>{ s.deletedAt = null; }, 'subjects'); renderRows(); Renderer.renderAll();
            }});
          }
        });
      }else if(act.dataset.act==='up' || act.dataset.act==='down'){
        const list = subs.filter(x=>!x.deletedAt).sort((a,b)=>a.order-b.order);
        const idx = list.findIndex(x=>x.id===id);
        const swapWith = act.dataset.act==='up' ? idx-1 : idx+1;
        if(swapWith<0 || swapWith>=list.length) return;
        const a = list[idx], b = list[swapWith];
        const tmp = a.order; a.order = b.order; b.order = tmp;
        State.set(()=>{}, 'subjects');
        renderRows(); Renderer.renderAll();
      }
    });
    wrap.querySelector('#subjectRows').addEventListener('change', e=>{
      const input = e.target.closest('[data-act="rename"]'); if(!input) return;
      const row = e.target.closest('[data-id]');
      const s = State.get().subjects.find(x=>x.id===row.dataset.id);
      const val = input.value.trim();
      if(!val){ input.value = s.name; return; }
      State.set(()=>{ s.name = val; }, 'subjects');
      Renderer.renderAll();
    });
    wrap.querySelector('#trashRows').addEventListener('click', e=>{
      const btn = e.target.closest('[data-act="restore"]'); if(!btn) return;
      const id = e.target.closest('[data-id]').dataset.id;
      const s = State.get().subjects.find(x=>x.id===id);
      State.set(()=>{ s.deletedAt = null; }, 'subjects');
      renderRows(); Renderer.renderAll();
    });
    wrap.querySelector('#addSubjectBtn').addEventListener('click', addSubject);
    wrap.querySelector('#newSubjectName').addEventListener('keydown', e=>{ if(e.key==='Enter') addSubject(); });
    function addSubject(){
      const input = wrap.querySelector('#newSubjectName');
      const name = input.value.trim();
      if(!name){ return; }
      const subs = State.get().subjects;
      const maxOrder = subs.reduce((m,s)=>Math.max(m,s.order), -1);
      State.set(()=>{
        subs.push({ id: Utils.uid('subj'), name, order: maxOrder+1, enabled:true, custom:true, deletedAt:null });
      }, 'subjects');
      input.value = '';
      renderRows(); Renderer.renderAll();
      Toast.show(`已添加「${name}」`);
    }
  }
  return { open };
})();

/* ============================== 16. Shortcuts ============================== */
const Shortcuts = (() => {
  function isTypingContext(){
    const el = document.activeElement;
    if(!el) return false;
    const tag = el.tagName;
    return tag==='INPUT' || tag==='TEXTAREA' || el.isContentEditable;
  }
  function bind(){
    const MODIFIER_KEYS = new Set(['shift','control','alt','meta']);
    document.addEventListener('keydown', (e)=>{
      const focusOpen = !document.getElementById('focusOverlay').hidden;
      if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){
        e.preventDefault(); openSearch(); return;
      }
      if(e.key === '?' && !isTypingContext() && !Dialog.isOpen()){
        e.preventDefault(); openShortcutsHelp(); return;
      }
      if(e.key === 'Escape'){
        if(Dialog.isOpen()){ Dialog.close(); return; }
        if(focusOpen){ FocusUI.exit(); return; }
        if(!DateEngine.isViewingToday()){ Actions.goToday(); return; }
        return;
      }
      if(MODIFIER_KEYS.has(e.key.toLowerCase())) return;
      if(isTypingContext() || Dialog.isOpen() || focusOpen) return;
      const k = e.key.toLowerCase();
      const sc = (State.get().settings.shortcuts || { e:'e', f:'f', n:'n', p:'p' });
      if(k===sc.e){ e.preventDefault(); Actions.toggleMode(); }
      else if(k===sc.f){ e.preventDefault(); FocusUI.enter(); }
      else if(k===sc.n){ e.preventDefault(); Actions.goRelative(1); }
      else if(k===sc.p){ e.preventDefault(); Actions.goRelative(-1); }
    });
  }
  function openShortcutsHelp(){
    const sc = State.get().settings.shortcuts || { e:'e', f:'f', n:'n', p:'p' };
    const wrap = document.createElement('div');
    wrap.innerHTML = `<div class="shortcut-grid">
      <div class="shortcut-item"><span>进入教室模式</span><kbd>${(sc.e||'E').toUpperCase()}</kbd></div>
      <div class="shortcut-item"><span>进入专注</span><kbd>${(sc.f||'F').toUpperCase()}</kbd></div>
      <div class="shortcut-item"><span>下一天</span><kbd>${(sc.n||'N').toUpperCase()}</kbd></div>
      <div class="shortcut-item"><span>上一天</span><kbd>${(sc.p||'P').toUpperCase()}</kbd></div>
      <div class="shortcut-item"><span>返回 / 关闭</span><kbd>Esc</kbd></div>
      <div class="shortcut-item"><span>快速搜索</span><kbd>Ctrl/⌘ K</kbd></div>
      <div class="shortcut-item"><span>快捷键帮助</span><kbd>?</kbd></div>
    </div>`;
    Dialog.open({ title:'快捷键', bodyNode: wrap });
  }
  function openSearch(){
    const wrap = document.createElement('div');
    wrap.innerHTML = `<input class="field__input" id="searchInput" placeholder="搜索历史日期、学科或作业内容…" data-autofocus>
      <div class="search-results" id="searchResults"></div>`;
    Dialog.open({ title:'快速搜索', bodyNode: wrap, wide:true });
    const input = wrap.querySelector('#searchInput');
    const results = wrap.querySelector('#searchResults');
    function run(){
      const q = input.value.trim();
      if(!q){ results.innerHTML = '<div class="search-empty">输入关键词以搜索历史作业</div>'; return; }
      const subjectsById = {}; State.get().subjects.forEach(s=>subjectsById[s.id]=s.name);
      const days = State.get().days;
      const matches = [];
      Object.keys(days).sort((a,b)=>b.localeCompare(a)).forEach(key=>{
        const day = days[key];
        Object.keys(day.assignments).forEach(sid=>{
          const rec = day.assignments[sid];
          const name = subjectsById[sid] || '';
          if(!rec.text) return;
          if(rec.text.toLowerCase().includes(q.toLowerCase()) || name.includes(q)){
            matches.push({ key, sid, name, snippet: rec.text.slice(0,60) });
          }
        });
      });
      results.innerHTML = matches.length ? matches.slice(0,40).map(m=>`
        <div class="search-result" data-key="${m.key}">
          <span class="search-result__meta"><span>${Utils.formatShortDate(m.key)}</span><span>${Utils.escapeHtml(m.name)}</span></span>
          <span class="search-result__snippet">${Utils.escapeHtml(m.snippet)}</span>
        </div>`).join('') : '<div class="search-empty">未找到匹配结果</div>';
    }
    input.addEventListener('input', Utils.debounce(run, 150));
    run();
    results.addEventListener('click', e=>{
      const r = e.target.closest('[data-key]'); if(!r) return;
      Actions.goToDate(r.dataset.key);
      Dialog.close();
    });
  }
  return { bind, openShortcutsHelp, rebind:()=>{}, openSearch };
})();

/* ============================== 17. FocusUI ============================== */
const FocusUI = (() => {
  const overlay = document.getElementById('focusOverlay');
  function enter(){
    overlay.hidden = false;
    overlay.setAttribute('aria-hidden','false');
    overlay.style.opacity='1';
    FocusTimer.updateUI();
  }
  function exit(){
    overlay.hidden = true;
    overlay.setAttribute('aria-hidden','true');
    overlay.style.opacity='';
    document.title = '今课 Nowledge · 南师附中';
  }
  function bind(){
    document.getElementById('focusEnterBtn').addEventListener('click', enter);
    document.getElementById('focusExitBtn').addEventListener('click', exit);
    document.getElementById('focusPlayBtn').addEventListener('click', ()=>FocusTimer.toggle());
    document.getElementById('focusResetBtn').addEventListener('click', ()=>{ FocusTimer.reset(); FocusTimer.updateUI(); });
    document.getElementById('focusSkipBtn').addEventListener('click', ()=>{ FocusTimer.skip(); });
    document.getElementById('focusSoundBtn').addEventListener('click', ()=>{
      State.set(s=>{ s.settings.soundEnabled = !s.settings.soundEnabled; }, 'settings');
      FocusTimer.updateUI();
    });
    document.getElementById('focusPresetSeg').addEventListener('click', e=>{
      const b = e.target.closest('button'); if(!b) return;
      if(b.dataset.preset === 'custom'){ openCustomDialog(); }
      else { FocusTimer.setPreset(b.dataset.preset); }
    });
  }
  function openCustomDialog(){
    const s = State.get().settings;
    const wrap = document.createElement('div');
    wrap.innerHTML = `<div class="field-row">
      <div class="field"><div class="field__label">专注（分钟）</div><input class="field__input" type="number" id="cw" min="1" max="180" value="${Math.round(s.focusWork/60)}" data-autofocus></div>
      <div class="field"><div class="field__label">休息（分钟）</div><input class="field__input" type="number" id="cb" min="1" max="60" value="${Math.round(s.focusBreak/60)}"></div>
    </div>`;
    const applyCustom = ()=>{
      const w = Math.min(180, Math.max(1, parseInt(wrap.querySelector('#cw').value,10)||25));
      const b = Math.min(60, Math.max(1, parseInt(wrap.querySelector('#cb').value,10)||5));
      wrap.querySelector('#cw').value = w;
      wrap.querySelector('#cb').value = b;
      FocusTimer.setCustom(w,b);
      Dialog.close();
    };
    Dialog.open({
      title:'自定义时长', bodyNode: wrap,
      actions:[{label:'确定', variant:'primary', onClick:applyCustom}]
    });
    wrap.addEventListener('keydown', e=>{
      if(e.key==='Enter'){
        e.preventDefault();
        applyCustom();
      }
    });
  }
  return { enter, exit, bind };
})();

/* ============================== 17.5 Reliability Guards ============================== */
(function reliabilityGuards(){
  document.addEventListener('keydown', e=>{
    if(e.key !== 'Escape') return;
    if(Dialog.isOpen()) Dialog.close();
  }, true);
})();

/* ============================== 17.6 ClassroomManager ============================== */
const ClassroomManager = (() => {
  let active=false;
  let statusText='';
  const view=document.getElementById('classroomView');
  const grid=document.getElementById('classroomGrid');
  const wrap=document.getElementById('classroomGridWrap');
  const esc=t=>Utils.escapeHtml(t||'');

  function render(){
    const day=Renderer.currentDayRecord();
    const subs=Renderer.visibleSubjects().filter(s=>{
      const a=day.assignments[s.id];
      return a && a.text && a.text.trim().length>0;
    });
    const d=new Date(DateEngine.getViewingKey()+'T12:00:00');
    const dl=Utils.formatDateLine(d);
    document.getElementById('classroomDate').textContent=dl.date;
    document.getElementById('classroomWeekday').textContent=dl.weekday;
    const q=QuoteEngine.getForDay(day);
    const zh=q.zh||'';
    const author=q.author||'';
    document.getElementById('classroomQuote').textContent=author?`“${zh}”  — ${author}`:`“${zh}”`;
    const priority=document.getElementById('classroomPriority');
    const priorityText=document.getElementById('classroomPriorityText');
    const note=(day.note||'').trim();
    priorityText.textContent=note||'今天最重要的一件事';
    priority.classList.toggle('is-empty',!note);
    const done=subs.filter(x=>day.assignments[x.id]?.completed).length;
    const base = `今日作业 · ${done}/${subs.length} 项完成 · ${subs.length?Math.round(done/subs.length*100):0}%`;
    statusText = base;
    document.getElementById('classroomStatus').textContent = base;
    grid.innerHTML='';
    grid.style.transform='none';
    grid.classList.toggle('is-empty', subs.length===0);
    if(!subs.length){
      grid.innerHTML='<div class="classroom-empty">今天还没有已布置的作业</div>';
      return;
    }
    subs.forEach(sub=>{
      const a=day.assignments[sub.id]||{};
      const c=document.createElement('article');
      c.className='classroom-card'; c.setAttribute('role','listitem');
      c.innerHTML=`<div class="classroom-card__title">${esc(sub.name)}</div><div class="classroom-card__body">${esc(a.text||'暂无作业')}</div><div class="classroom-card__meta">${a.completed?'✓ 已完成':'待完成'}</div>`;
      grid.appendChild(c);
    });
  }

  function measure(){
    if(!active||!grid.children.length)return;
    if(grid.classList.contains('is-empty'))return;
    const box=wrap.getBoundingClientRect();
    const W=box.width, H=box.height, n=grid.children.length;
    const maxCols=Math.min(6,n);
    let best=null;
    grid.style.visibility='hidden'; grid.style.overflow='visible'; grid.style.transform='none';
    for(let cols=1;cols<=maxCols;cols++){
      const widthPer=(W-(cols-1)*18)/cols;
      if(widthPer<125) continue;
      for(let font=32;font>=12;font-=1){
        const gap=font>=22?18:font>=17?14:10;
        const pad=font>=22?10:font>=17?7:5;
        const line=font>=22?1.38:font>=17?1.32:1.26;
        grid.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;
        grid.style.setProperty('--class-gap',gap+'px');
        grid.style.setProperty('--class-pad',pad+'px');
        grid.style.setProperty('--class-body',font+'px');
        grid.style.setProperty('--class-title',Math.max(14,font+2)+'px');
        grid.style.setProperty('--class-line',String(line));
        void grid.offsetHeight;
        const r=grid.getBoundingClientRect();
        const height=r.height;
        const fits=height<=H;
        const score=(fits?10000000:0)+font*10000-cols*120-height*4;
        const candidate={cols,font,gap,pad,line,height,score};
        if(!best||score>best.score)best=candidate;
      }
    }
    if(!best) best={cols:Math.max(1,Math.min(6,n)),font:12,gap:8,pad:4,line:1.2,height:H*1.4,score:0};
    grid.style.gridTemplateColumns=`repeat(${best.cols},minmax(0,1fr))`;
    grid.style.setProperty('--class-gap',best.gap+'px');
    grid.style.setProperty('--class-pad',best.pad+'px');
    grid.style.setProperty('--class-body',best.font+'px');
    grid.style.setProperty('--class-title',Math.max(14,best.font+2)+'px');
    grid.style.setProperty('--class-line',String(best.line));
    void grid.offsetHeight;
    const natural=grid.getBoundingClientRect().height;
    const scale=Math.min(1, H/Math.max(1,natural));
    grid.style.transform=`scale(${scale})`;
    grid.classList.remove('is-scrollable');
    grid.style.visibility=''; grid.style.overflow='visible';
    const suffix=scale<.999?` · ${best.cols} 列 · 自动缩放 ${Math.round(scale*100)}%`:` · ${best.cols} 列 · 已适配一屏`;
    document.getElementById('classroomStatus').textContent=statusText+suffix;
  }
  function open(){active=true;render();view.hidden=false;view.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';requestAnimationFrame(()=>requestAnimationFrame(measure));}
  function close(){active=false;view.hidden=true;view.setAttribute('aria-hidden','true');document.body.style.overflow='';Renderer.renderModeUI();}
  function bind(){
    document.getElementById('classroomExitBtn').addEventListener('click',close);
    document.getElementById('classroomThemeBtn').addEventListener('click',()=>{Actions.cycleTheme();render();requestAnimationFrame(measure);});
    window.addEventListener('resize',Utils.debounce(measure,100));
    document.addEventListener('keydown',e=>{if(active&&e.key==='Escape'){e.preventDefault();close();}},true);
  }
  return {open,close,bind,measure};
})();

/* ============================== 18. Init ============================== */
(function init(){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', ()=>{
    if(State.get().settings.theme==='system') Renderer.applyTheme();
  });

  State.pruneHistory();
  State.ensureDay(DateEngine.todayKey());
  State.persistNow();

  Renderer.setClassroomRerender(()=>ClassroomManager.measure());
  Renderer.renderAll();
  FocusTimer.init();
  FocusTimer.updateUI();
  FocusTimer.acquireWakeLock();
  window.addEventListener('beforeunload', ()=> FocusTimer.releaseWakeLock());

  CardInteraction.bind();
  Shortcuts.bind();
  FocusUI.bind();
  ClassroomManager.bind();

  document.getElementById('modeToggleBtn').addEventListener('click', Actions.toggleMode);
  document.getElementById('themeToggleBtn').addEventListener('click', Actions.cycleTheme);
  document.getElementById('settingsBtn').addEventListener('click', SettingsPanel.open);
  document.getElementById('quoteNextBtn').addEventListener('click', Actions.nextQuote);
  document.getElementById('copyYesterdayBtn').addEventListener('click', Actions.copyYesterday);
  document.getElementById('datePrevBtn').addEventListener('click', ()=>Actions.goRelative(-1));
  document.getElementById('dateNextBtn').addEventListener('click', ()=>Actions.goRelative(1));
  document.getElementById('dateTodayBtn').addEventListener('click', Actions.goToday);
  document.getElementById('onboardingClose').addEventListener('click', ()=>{
    State.set(s=>{ s.meta.onboardingShown = true; }, 'meta');
    Renderer.renderOnboarding();
  });

  const noteInput = document.getElementById('noteInput');
  noteDebounce = Utils.debounce((v)=>Actions.saveNote(v), 400);
  noteInput.addEventListener('input', (e)=>noteDebounce(e.target.value));

  DateEngine.start(
    (d)=>{
      Renderer.renderClock(d);
    },
    (newKey)=>{
      if(noteDebounce) noteDebounce.flush();
      State.ensureDay(newKey);
      State.persistNow();
      if(DateEngine.isViewingToday()) Renderer.renderAll();
      Toast.show('新的一天开始了');
    }
  );

  window.addEventListener('resize', Utils.debounce(()=>Renderer.scheduleLayout(), 120));
  window.addEventListener('orientationchange', ()=>Renderer.scheduleLayout());
  if(window.ResizeObserver){
    const layoutObserver = new ResizeObserver(()=>Renderer.scheduleLayout());
    const gridWrapEl = document.getElementById('gridWrap');
    if(gridWrapEl) layoutObserver.observe(gridWrapEl);
  }

  window.addEventListener('load', ()=>Renderer.scheduleLayout());
})();
</script>
