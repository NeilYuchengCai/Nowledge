        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn" id="exportBtn">导出数据</button>
          <button class="btn" id="importBtn">导入数据</button>
          <input type="file" id="importFile" accept="application/json" style="display:none;">
          <button class="btn btn--danger" id="clearAllBtn">清空所有数据</button>
        </div>
        <div class="field__hint">历史记录至少保留 30 天，实际保留最近 ${HISTORY_KEEP_DAYS} 天。</div>
      </div>
    `;

    // — 快捷键编辑器 —
    const RESERVERD_KEYS = new Set(['escape','enter','arrowup','arrowdown','arrowleft','arrowright','tab','space','delete','backspace','shift','control','alt','meta']);
    const SHORTCUT_DEF = [
      { key: 'e', action: '进入教室模式' },
      { key: 'f', action: '进入专注模式' },
      { key: 'n', action: '下一天' },
      { key: 'p', action: '上一天' },
    ];
    function renderShortcutEditor(){
      const container = wrap.querySelector('#shortcutEditor');
      if(!container) return;
      const shortcuts = State.get().settings.shortcuts || { e:'e', f:'f', n:'n', p:'p' };
      container.innerHTML = SHORTCUT_DEF.map(def => {
        const currentKey = (shortcuts[def.key] || def.key).toUpperCase();
        const isReserved = RESERVERD_KEYS.has(currentKey.toLowerCase());
        return `<div class="shortcut-item" style="gap:10px;">
          <span style="flex:1;font-size:13px;color:var(--ink-soft);">${def.action}</span>
          <kbd data-target="${def.key}" class="shortcut-kbd ${isReserved?'is-reserved':''}">${currentKey}</kbd>
        </div>`;
      }).join('');

      container.querySelectorAll('.shortcut-kbd').forEach(kbd => {
        kbd.addEventListener('click', ()=>{
          const targetKey = kbd.dataset.target;
          if(RESERVERD_KEYS.has(shortcuts[targetKey]||'')) return;
          kbd.textContent = '...';
          kbd.classList.add('is-listening');
          kbd.setAttribute('aria-label','按下新按键');

          const once = (e)=>{
            e.preventDefault();
            document.removeEventListener('keydown', once);
            const newKey = e.key.toLowerCase();
            if(RESERVERD_KEYS.has(newKey)){
              Toast.show('该按键已保留，请选择其他按键');
              kbd.textContent = (shortcuts[targetKey]||targetKey).toUpperCase();
              kbd.classList.remove('is-listening');
              return;
            }
            // 检查是否被其他条目占用
            const conflict = SHORTCUT_DEF.find(d=>d.key!==targetKey && shortcuts[d.key]===newKey);
            if(conflict){
              Toast.show(`按键 "${newKey.toUpperCase()}" 已被「${conflict.action}」占用`);
              kbd.textContent = (shortcuts[targetKey]||targetKey).toUpperCase();
              kbd.classList.remove('is-listening');
              return;
            }
            State.set(st=>{ st.settings.shortcuts[targetKey] = newKey; }, 'settings');
            Shortcuts.rebind();
            kbd.textContent = newKey.toUpperCase();
            kbd.classList.remove('is-listening');
          };
          document.addEventListener('keydown', once, { once:false });
        });
      });
    }
    renderShortcutEditor();

    const unsubscribeSettings = State.subscribe((kind)=>{
      if(kind==='settings') {
        renderShortcutEditor();
      }
    });

    // 关闭设置面板时取消订阅（使用Dialog.open的onClose回调）
    Dialog.open({ title:'设置', bodyNode: wrap, wide:true, onClose: unsubscribeSettings });

    const themeSeg = wrap.querySelector('#themeSeg');
    function syncSeg(){
      themeSeg.querySelectorAll('button').forEach(b=>b.classList.toggle('is-active', b.dataset.v===State.get().settings.theme));
    }
    syncSeg();
    themeSeg.addEventListener('click', e=>{
      const b = e.target.closest('button'); if(!b) return;
      State.set(s=>{ s.settings.theme = b.dataset.v; }, 'settings');
      Renderer.renderThemeUI(); syncSeg();
    });

    const autoSwitch = wrap.querySelector('#autoStartSwitch');
    autoSwitch.setAttribute('aria-checked', s.autoStartNext);
    autoSwitch.addEventListener('click', ()=>{
      State.set(st=>{ st.settings.autoStartNext = !st.settings.autoStartNext; }, 'settings');
      autoSwitch.setAttribute('aria-checked', State.get().settings.autoStartNext);
    });
    const soundSwitch = wrap.querySelector('#soundSwitch');
    soundSwitch.setAttribute('aria-checked', s.soundEnabled);
    soundSwitch.addEventListener('click', ()=>{
      State.set(st=>{ st.settings.soundEnabled = !st.settings.soundEnabled; }, 'settings');
      soundSwitch.setAttribute('aria-checked', State.get().settings.soundEnabled);
      FocusTimer.updateUI();
    });

    wrap.querySelector('#openSubjectsBtn').addEventListener('click', SubjectManager.open);
    wrap.querySelector('#openAIBtn').addEventListener('click', AISettings.open);

    // 关闭设置面板时取消订阅（使用Dialog.open的onClose回调）

    function renderExams(){
      const list = wrap.querySelector('#examList');
      const exams = State.get().exams.slice().sort((a,b)=>a.date.localeCompare(b.date));
      list.innerHTML = exams.length ? exams.map(e=>`
        <div class="subject-manage-row" data-id="${e.id}">
          <span class="subject-manage-row__name">${Utils.escapeHtml(e.name)} <span style="color:var(--muted-2)">· ${e.date}</span></span>
          <button class="menu__item menu__item--danger" style="width:auto;padding:4px 8px;" data-act="delExam"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>`).join('') : '<div class="field__hint">暂无考试倒计时</div>';
    }
    renderExams();
    wrap.querySelector('#examList').addEventListener('click', e=>{
      const btn = e.target.closest('[data-act="delExam"]'); if(!btn) return;
      const id = btn.closest('[data-id]').dataset.id;
      State.set(st=>{ st.exams = st.exams.filter(x=>x.id!==id); }, 'exams');
      renderExams(); Renderer.renderStatus();
    });
    wrap.querySelector('#examAddBtn').addEventListener('click', ()=>{
      const name = wrap.querySelector('#examName').value.trim();
      const date = wrap.querySelector('#examDate').value;
      if(!name || !date){ Toast.show('请填写考试名称与日期'); return; }
      State.set(st=>{ st.exams.push({id:Utils.uid('exam'), name, date}); }, 'exams');
      wrap.querySelector('#examName').value=''; wrap.querySelector('#examDate').value='';
      renderExams(); Renderer.renderStatus();
    });

    wrap.querySelector('#exportBtn').addEventListener('click', ()=>{
      const data = JSON.stringify(State.get(), null, 2);
      Utils.download(`今课 Nowledge-南师附中-数据备份-${DateEngine.todayKey()}.json`, data);
      Toast.show('已导出 JSON 文件');
    });
    const fileInput = wrap.querySelector('#importFile');
    wrap.querySelector('#importBtn').addEventListener('click', ()=>fileInput.click());
    fileInput.addEventListener('change', ()=>{
      const file = fileInput.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const parsed = JSON.parse(reader.result);
          if(!Store.isValid(parsed)) throw new Error('结构不完整');
          Dialog.confirm({
            title:'确认导入', message:'导入将<b>覆盖</b>当前所有数据，此操作不可撤销，是否继续？',
            confirmLabel:'导入并覆盖', danger:true,
            onConfirm:()=>{
              State.replaceAll(parsed);
              Renderer.renderAll();
              Toast.show('数据已导入');
            }
          });
        }catch(e){
          Toast.show('导入失败：文件格式不正确');
        }
        fileInput.value = '';
      };
      reader.onerror = ()=>{ Toast.show('文件读取失败'); };
      reader.readAsText(file);
    });
    wrap.querySelector('#clearAllBtn').addEventListener('click', ()=>{
      Dialog.confirm({
        title:'清空所有数据', message:'将删除全部学科、历史作业与设置，恢复到初始状态。此操作<b>不可恢复</b>，是否继续？',
        confirmLabel:'清空所有数据', danger:true,
        onConfirm:()=>{
          State.resetAll();
          DateEngine.setViewingKey(DateEngine.todayKey());
          Renderer.renderAll();
          Toast.show('已清空所有数据');
        }
      });
    });

    // — 清除布局记忆 —
    wrap.querySelector('#clearPrefBtn').addEventListener('click', ()=>{
      LayoutEngine.clearPrefs(false);
      LayoutEngine.clearPrefs(true);
      Toast.show('布局记忆已清除');
    });
  }
  return { open };
})();

/* ============================== 14.5 AI 设置页 ============================== */
const AISettings = (() => {
  function open(){
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="toggle-row">
        <div><div class="toggle-row__label">启用 AI 功能</div><div class="field__hint">关闭后，编辑作业中的 AI 按钮将不可用。</div></div>
        <button class="switch" id="aiEnabled" role="switch" aria-label="启用 AI 功能"></button>
      </div>
      <div class="field__hint ai-hint">密钥仅保存在本机浏览器，直接发往你填写的服务商接口（OpenAI 兼容 /v1/chat/completions）。若浏览器提示跨域(CORS)错误，请使用支持 CORS 的接口或本地代理（如 LM Studio / Ollama / vLLM 已默认开启）。请妥善保管密钥。</div>
      <div class="ai-section">
        <div class="field__label">已保存的 AI</div>
        <div class="ai-list" id="aiList"></div>
      </div>
      <div class="ai-form" id="aiForm" hidden>
        <div class="field__label" id="aiFormTitle">添加 AI</div>
        <input class="field__input" id="aiName" placeholder="名称，如 我的OpenAI / 本地LM">
        <input class="field__input" id="aiBase" placeholder="Base URL，如 https://api.openai.com/v1">
        <input class="field__input" id="aiModel" placeholder="模型，如 gpt-4o-mini">
        <input class="field__input" id="aiKey" type="password" placeholder="API Key（本地服务可留空）" autocomplete="off">
        <div style="display:flex;gap:8px;align-items:center;">
          <label class="field__label" style="margin:0;white-space:nowrap;">认证方式</label>
          <select class="field__input" id="aiAuth" style="flex:1;">
            <option value="bearer">Authorization: Bearer（OpenAI 兼容）</option>
            <option value="apikey">api-key</option>
          </select>
        </div>
        <input class="field__input" id="aiProxy" placeholder="CORS 代理（可选）：如 https://你的代理/?url={url}">
        <div class="field__hint">部分厂商的接口不允许浏览器跨域，会报 “Failed to fetch”。此时填一个 CORS 代理把请求转发出去即可；{url} 会被替换成实际地址。</div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn--primary" id="aiSave">保存</button>
          <button class="btn" id="aiTestConn" type="button">测试连接</button>
          <button class="btn" id="aiCancel">取消</button>
        </div>
      </div>
      <!-- 状态行放在表单外：保存后表单会隐藏，自动测试连接的结果必须仍然可见 -->
      <div class="ai-status-line" id="aiFormStatus" hidden style="margin-top:8px;"></div>
      <button class="btn" id="aiAddBtn" style="margin-top:10px;width:100%;justify-content:center;">+ 添加 AI</button>
    `;
    Dialog.open({ title:'AI 设置', bodyNode: wrap, wide:true });

    const enabledSwitch = wrap.querySelector('#aiEnabled');
    enabledSwitch.setAttribute('aria-checked', !!State.get().ai.enabled);
    enabledSwitch.addEventListener('click', ()=>{
      AIService.setEnabled(!State.get().ai.enabled);
      enabledSwitch.setAttribute('aria-checked', !!State.get().ai.enabled);
    });

    const listEl = wrap.querySelector('#aiList');
    const form = wrap.querySelector('#aiForm');
    const formTitle = wrap.querySelector('#aiFormTitle');
    const nameI = wrap.querySelector('#aiName');
    const baseI = wrap.querySelector('#aiBase');
    const modelI = wrap.querySelector('#aiModel');
    const keyI = wrap.querySelector('#aiKey');
    const authI = wrap.querySelector('#aiAuth');
    const proxyI = wrap.querySelector('#aiProxy');
    const formStatus = wrap.querySelector('#aiFormStatus');
    let editingId = null;
    let testSeq = 0; // 只展示最后一次测试的结果，避免并发测试互相覆盖状态文案

    function renderList(){
      const ai = State.get().ai;
      if(!ai.list.length){ listEl.innerHTML = '<div class="ai-empty">还没有保存任何 AI，点下方“添加 AI”。</div>'; return; }
      listEl.innerHTML = ai.list.map(c=>`
        <div class="ai-card${c.id===ai.activeId?' is-active':''}">
          <div class="ai-card__top">
            <span class="ai-card__name">${Utils.escapeHtml(c.name)}</span>
            ${c.id===ai.activeId?'<span class="ai-card__badge">当前使用</span>':''}
          </div>
          <div class="ai-card__meta">${Utils.escapeHtml(c.model||'未填模型')} · ${Utils.escapeHtml(c.baseURL||'未填地址')}</div>
          <div class="ai-card__actions">
            ${c.id===ai.activeId?'':'<button class="btn btn--sm" data-act="use" data-id="'+c.id+'">选用</button>'}
            <button class="btn btn--sm" data-act="edit" data-id="${c.id}">编辑</button>
            <button class="btn btn--sm" data-act="test" data-id="${c.id}">测试</button>
            <button class="btn btn--sm btn--danger" data-act="del" data-id="${c.id}">删除</button>
          </div>
        </div>`).join('');
    }
    renderList();

    listEl.addEventListener('click', async (e)=>{
      const b = e.target.closest('[data-act]'); if(!b) return;
      const id = b.dataset.id, act = b.dataset.act;
      if(act==='use'){ AIService.setActive(id); renderList(); Toast.show('已切换 AI'); }
      else if(act==='edit'){
        editingId = id; const c = AIService.list().find(x=>x.id===id);
        form.hidden=false; formTitle.textContent='编辑 AI';
        nameI.value=c.name; baseI.value=c.baseURL; modelI.value=c.model; keyI.value=c.apiKey;
        authI.value = (c.authHeader === 'api-key' || c.auth === 'apikey') ? 'apikey' : 'bearer';
        proxyI.value = c.proxy || '';
        formStatus.hidden=true;
      }
      else if(act==='del'){
        const c = AIService.list().find(x=>x.id===id);
        Dialog.confirm({ title:'删除 AI', message:'确定删除「'+Utils.escapeHtml(c.name)+'」？', confirmLabel:'删除', danger:true,
          onConfirm:()=>{ AIService.remove(id); renderList(); Toast.show('已删除'); } });
      }
      else if(act==='test'){ await testAI(id, b); }
    });

    async function testAI(id, btn){
      const c = AIService.list().find(x=>x.id===id);
      if(!c){ Toast.show('该配置已不存在，请重新打开设置'); return; }
      const prev = btn.textContent; btn.disabled=true; btn.textContent='测试中…';
      try{
        // 用已保存的认证头：add/update 只存 authHeader/authScheme，不存 auth 字段，
        // 从 c.auth 反推会永远得到 Bearer，令 api-key 类服务（如 MiMo）误报 401。
        const authCfg = {
          authHeader: c.authHeader || 'Authorization',
          authScheme: (c.authScheme != null) ? c.authScheme : (c.auth==='apikey' ? '' : 'Bearer ')
        };
        const out = await AIService.testConnection({ baseURL:c.baseURL, apiKey:c.apiKey, model:c.model, ...authCfg, proxy:c.proxy||'' });
        Toast.show('连接成功：' + (typeof out==='string' ? out.slice(0,24) : 'OK'));
      }catch(err){
        Toast.show('测试失败：' + (err&&err.message?err.message:err));
      }finally{ btn.disabled=false; btn.textContent=prev; }
    }

    // 表单内“测试连接”：用当前填写（未必已保存）的配置直接测
    wrap.querySelector('#aiTestConn').addEventListener('click', async ()=>{
      const seq = ++testSeq; // 本次点击作废旧测试的在途结果
      const base=baseI.value.trim(), model=modelI.value.trim(), proxy=proxyI.value.trim();
      if(!base){ formStatus.hidden=false; formStatus.textContent='请先填写 Base URL'; formStatus.className='ai-status-line is-error'; return; }
      if(!model){ formStatus.hidden=false; formStatus.textContent='请先填写模型名称'; formStatus.className='ai-status-line is-error'; return; }
      const authCfg = authI.value==='apikey' ? { authHeader:'api-key', authScheme:'' } : { authHeader:'Authorization', authScheme:'Bearer ' };
      formStatus.hidden=false; formStatus.textContent='测试中…'; formStatus.className='ai-status-line';
      try{
        const out = await AIService.testConnection({ baseURL:base, apiKey:keyI.value, model, ...authCfg, proxy });
        if(seq!==testSeq) return;
        formStatus.hidden=false;
        formStatus.textContent='连接成功：' + (typeof out==='string'?out.slice(0,40):'OK');
        formStatus.className='ai-status-line is-ok';
      }catch(err){
        if(seq!==testSeq) return;
        formStatus.hidden=false;
        formStatus.textContent='连接失败：' + (err&&err.message?err.message:err);
        formStatus.className='ai-status-line is-error';
      }
    });

    wrap.querySelector('#aiAddBtn').addEventListener('click', ()=>{
      testSeq++;
      editingId=null; form.hidden=false; formTitle.textContent='添加 AI';
      nameI.value=''; baseI.value='https://api.openai.com/v1'; modelI.value='gpt-4o-mini'; keyI.value='';
      authI.value='bearer'; proxyI.value='';
      formStatus.hidden=true; nameI.focus();
    });
    wrap.querySelector('#aiCancel').addEventListener('click', ()=>{ testSeq++; form.hidden=true; editingId=null; formStatus.hidden=true; });
    wrap.querySelector('#aiSave').addEventListener('click', async ()=>{
      const seq = ++testSeq; // 保存后的自动测试也参与序号，避免与手动测试互相覆盖
      const name=nameI.value.trim(), base=baseI.value.trim(), model=modelI.value.trim(), key=keyI.value, auth=authI.value, proxy=proxyI.value.trim();
      if(!name){ formStatus.hidden=false; formStatus.textContent='请填写名称'; formStatus.className='ai-status-line is-error'; return; }
      if(!base){ formStatus.hidden=false; formStatus.textContent='请填写 Base URL'; formStatus.className='ai-status-line is-error'; return; }
      const authCfg = auth==='apikey' ? { authHeader:'api-key', authScheme:'' } : { authHeader:'Authorization', authScheme:'Bearer ' };
      if(editingId){ AIService.update(editingId, {name, baseURL:base, model, apiKey:key, auth, proxy, ...authCfg}); Toast.show('已更新'); }
      else { AIService.add({name, baseURL:base, model, apiKey:key, auth, proxy, ...authCfg}); Toast.show('已添加'); }
      form.hidden=true; editingId=null; renderList();
      // 状态行已移到表单外，保存后依然可见
      formStatus.hidden=false; formStatus.textContent='保存成功，正在自动测试连接…'; formStatus.className='ai-status-line';
      try{
        const out = await AIService.testConnection({ baseURL:base, apiKey:key, model, ...authCfg, proxy });
        if(seq!==testSeq) return;
        formStatus.hidden=false;
        formStatus.textContent='✅ 连接成功：' + (typeof out==='string'?out.slice(0,40):'OK');
        formStatus.className='ai-status-line is-ok';
      }catch(err){
        if(seq!==testSeq) return;
        formStatus.hidden=false;
        formStatus.textContent='⚠️ 保存成功，但连接测试失败：' + (err&&err.message?err.message:err);
        formStatus.className='ai-status-line is-error';
      }
    });
  }
  return { open };
})();

/* ============================== 15. 学科管理 Subject Manager ============================== */

      wrap.querySelector('#trashRows').innerHTML = deleted.length ? deleted.map(s=>`
        <div class="subject-manage-row" data-id="${s.id}">
          <span class="subject-manage-row__name">${Utils.escapeHtml(s.name)}</span>
          <button class="btn btn--sm" data-act="restore">恢复</button>
        </div>`).join('') : '<div class="field__hint">暂无已删除学科</div>';
    }

    wrap.querySelector('#subjectRows').addEventListener('click', e=>{
      const row = e.target.closest('[data-id]'); if(!row) return;
      const id = row.dataset.id;
      const act = e.target.closest('[data-act]');
      if(!act) return;
      const subs = State.get().subjects;
      const s = subs.find(x=>x.id===id);
      if(act.dataset.act==='toggle'){
        State.set(()=>{ s.enabled = !s.enabled; }, 'subjects');
        renderRows(); Renderer.renderAll();
      }else if(act.dataset.act==='delete'){
        Dialog.confirm({
          title:'删除学科', message:`确定要删除「<b>${Utils.escapeHtml(s.name)}</b>」吗？删除后可在下方「已删除的学科」中恢复。`,
          confirmLabel:'删除', danger:true,
          onConfirm:()=>{
            State.set(()=>{ s.deletedAt = Date.now(); }, 'subjects');
            renderRows(); Renderer.renderAll();
            Toast.show(`已删除「${s.name}」`, { undo: ()=>{
              State.set(()=>{ s.deletedAt = null; }, 'subjects'); renderRows(); Renderer.renderAll();
            }});
          }
        });
      }else if(act.dataset.act==='up' || act.dataset.act==='down'){
        const list = subs.filter(x=>!x.deletedAt).sort((a,b)=>a.order-b.order);
        const idx = list.findIndex(x=>x.id===id);
        const swapWith = act.dataset.act==='up' ? idx-1 : idx+1;
        if(swapWith<0 || swapWith>=list.length) return;
        const a = list[idx], b = list[swapWith];
        const tmp = a.order; a.order = b.order; b.order = tmp;
        State.set(()=>{}, 'subjects');
        renderRows(); Renderer.renderAll();
      }
    });
    wrap.querySelector('#subjectRows').addEventListener('change', e=>{
      const input = e.target.closest('[data-act="rename"]'); if(!input) return;
      const row = e.target.closest('[data-id]');
      const s = State.get().subjects.find(x=>x.id===row.dataset.id);
      const val = input.value.trim();
      if(!val){ input.value = s.name; return; }
      State.set(()=>{ s.name = val; }, 'subjects');
      Renderer.renderAll();
    });
    wrap.querySelector('#trashRows').addEventListener('click', e=>{
      const btn = e.target.closest('[data-act="restore"]'); if(!btn) return;
      const id = e.target.closest('[data-id]').dataset.id;
      const s = State.get().subjects.find(x=>x.id===id);
      State.set(()=>{ s.deletedAt = null; }, 'subjects');
      renderRows(); Renderer.renderAll();
    });
    wrap.querySelector('#addSubjectBtn').addEventListener('click', addSubject);
    wrap.querySelector('#newSubjectName').addEventListener('keydown', e=>{ if(e.key==='Enter') addSubject(); });
    function addSubject(){
      const input = wrap.querySelector('#newSubjectName');
      const name = input.value.trim();
      if(!name){ return; }
      const subs = State.get().subjects;
      const maxOrder = subs.reduce((m,s)=>Math.max(m,s.order), -1);
      State.set(()=>{
        subs.push({ id: Utils.uid('subj'), name, order: maxOrder+1, enabled:true, custom:true, deletedAt:null });
      }, 'subjects');
      input.value = '';
      renderRows(); Renderer.renderAll();
      Toast.show(`已添加「${name}」`);
    }
  }
  return { open };
})();

/* ============================== 16. 快捷键 & 搜索 ============================== */
const Shortcuts = (() => {
  function isTypingContext(){
    const el = document.activeElement;
    if(!el) return false;
    const tag = el.tagName;
    return tag==='INPUT' || tag==='TEXTAREA' || el.isContentEditable;
  }
  function bind(){
    const MODIFIER_KEYS = new Set(['shift','control','alt','meta']);
    document.addEventListener('keydown', (e)=>{
      const focusOpen = !document.getElementById('focusOverlay').hidden;
      if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){
        e.preventDefault(); openSearch(); return;
      }
      if(e.key === '?' && !isTypingContext() && !Dialog.isOpen()){
        e.preventDefault(); openShortcutsHelp(); return;
      }
      if(e.key === 'Escape'){
        if(Dialog.isOpen()){ Dialog.close(); return; }
        if(focusOpen){ FocusUI.exit(); return; }
        if(!DateEngine.isViewingToday()){ Actions.goToday(); return; }
        return;
      }
      // Modifier 键本身按下时不触发任何自定义快捷键，避免拦截组合键
      if(MODIFIER_KEYS.has(e.key.toLowerCase())) return;
      if(isTypingContext() || Dialog.isOpen() || focusOpen) return;
      const k = e.key.toLowerCase();
      const sc = (State.get().settings.shortcuts || { e:'e', f:'f', n:'n', p:'p' });
      // Alt+L 优先判断，避免被重映射的 p 键拦截
      if(e.altKey && k==='l'){
        e.preventDefault();
        // 触发一次带 userInitiated=true 的布局计算
        const isClassroom = State.get().settings.mode === 'classroom';
        LayoutEngine.compute(Renderer.els.gridWrap, Renderer.els.grid, Renderer.visibleSubjects().length, {
          classroom: isClassroom,
          fallback: isClassroom ? 'scale' : 'scroll',
          userInitiated: true
        });
        // 显示提示（静默，不弹 toast）
        const hint = document.getElementById('layoutHint');
        if (hint) {
          hint.title = '已记忆当前布局偏好';
          setTimeout(()=>{ hint.title = ''; }, 2000);
        }
      }
    });
  }
  function openShortcutsHelp(){
    const sc = State.get().settings.shortcuts || { e:'e', f:'f', n:'n', p:'p' };
    const wrap = document.createElement('div');
    wrap.innerHTML = `<div class="shortcut-grid">
      <div class="shortcut-item"><span>进入教室模式</span><kbd>${(sc.e||'E').toUpperCase()}</kbd></div>
      <div class="shortcut-item"><span>进入专注</span><kbd>${(sc.f||'F').toUpperCase()}</kbd></div>
      <div class="shortcut-item"><span>下一天</span><kbd>${(sc.n||'N').toUpperCase()}</kbd></div>
      <div class="shortcut-item"><span>上一天</span><kbd>${(sc.p||'P').toUpperCase()}</kbd></div>
      <div class="shortcut-item"><span>返回 / 关闭</span><kbd>Esc</kbd></div>
      <div class="shortcut-item"><span>快速搜索</span><kbd>Ctrl/⌘ K</kbd></div>
      <div class="shortcut-item"><span>快捷键帮助</span><kbd>?</kbd></div>
    </div>`;
    Dialog.open({ title:'快捷键', bodyNode: wrap });
  }
  function rebind(){ /* 快捷键绑定在 bind() 中动态读取 State，无需重新绑定 */ }
  function openSearch(){
    const wrap = document.createElement('div');
    wrap.innerHTML = `<input class="field__input" id="searchInput" placeholder="搜索历史日期、学科或作业内容…" data-autofocus>
      <div class="search-results" id="searchResults"></div>`;
    Dialog.open({ title:'快速搜索', bodyNode: wrap, wide:true });
    const input = wrap.querySelector('#searchInput');
    const results = wrap.querySelector('#searchResults');
    function run(){
      const q = input.value.trim();
      if(!q){ results.innerHTML = '<div class="search-empty">输入关键词以搜索历史作业</div>'; return; }
      const subjectsById = {}; State.get().subjects.forEach(s=>subjectsById[s.id]=s.name);
      const days = State.get().days;
      const matches = [];
      Object.keys(days).sort((a,b)=>b.localeCompare(a)).forEach(key=>{
        const day = days[key];
        Object.keys(day.assignments).forEach(sid=>{
          const rec = day.assignments[sid];
          const name = subjectsById[sid] || '';
          const text = subjectItems(rec).map(i=>(i.text||'')).join('\n');
          if(!text.trim()) return;
          if(text.toLowerCase().includes(q.toLowerCase()) || name.includes(q)){
            matches.push({ key, sid, name, snippet: text.slice(0,60) });
          }
        });
      });
      results.innerHTML = matches.length ? matches.slice(0,40).map(m=>`
        <div class="search-result" data-key="${m.key}">
          <span class="search-result__meta"><span>${Utils.formatShortDate(m.key)}</span><span>${Utils.escapeHtml(m.name)}</span></span>
          <span class="search-result__snippet">${Utils.escapeHtml(m.snippet)}</span>
        </div>`).join('') : '<div class="search-empty">未找到匹配结果</div>';
    }
    input.addEventListener('input', Utils.debounce(run, 150));
    run();
    results.addEventListener('click', e=>{
      const r = e.target.closest('[data-key]'); if(!r) return;
      Actions.goToDate(r.dataset.key);
      Dialog.close();
    });
  }
  return { bind, openShortcutsHelp, openSearch };
})();

/* ============================== 17. Focus Mode UI ============================== */
const FocusUI = (() => {
  const overlay = document.getElementById('focusOverlay');
  function enter(){
    overlay.hidden = false;
    overlay.setAttribute('aria-hidden','false');
    overlay.style.opacity='1';
    FocusTimer.updateUI();
    // 延迟到下一帧再请求全屏，避免事件竞态
    setTimeout(()=>document.documentElement.requestFullscreen().catch(()=>{}),50);
  }
  function exit(){
    overlay.hidden = true;
    overlay.setAttribute('aria-hidden','true');
    overlay.style.opacity='';
    document.title = '今课 Nowledge · 南师附中';
    if(document.fullscreenElement) document.exitFullscreen();
  }
  function bind(){
    document.getElementById('focusEnterBtn').addEventListener('click', enter);
    document.getElementById('focusExitBtn').addEventListener('click', exit);
    document.getElementById('focusPlayBtn').addEventListener('click', ()=>FocusTimer.toggle());
    document.getElementById('focusResetBtn').addEventListener('click', ()=>{ FocusTimer.reset(); FocusTimer.updateUI(); });
    document.getElementById('focusSkipBtn').addEventListener('click', ()=>{ FocusTimer.skip(); });
    document.getElementById('focusSoundBtn').addEventListener('click', ()=>{
      State.set(s=>{ s.settings.soundEnabled = !s.settings.soundEnabled; }, 'settings');
      FocusTimer.updateUI();
    });
    document.getElementById('focusPresetSeg').addEventListener('click', e=>{
      const b = e.target.closest('button'); if(!b) return;
      if(b.dataset.preset === 'custom'){ openCustomDialog(); }
      else { FocusTimer.setPreset(b.dataset.preset); }
    });
    // 专注模式下如果全屏被退出，也关闭专注模式
    document.addEventListener('fullscreenchange',()=>{
      if(!overlay.hidden && !document.fullscreenElement) exit();
    });
  }
  function openCustomDialog(){
    const s = State.get().settings;
    const wrap = document.createElement('div');
    wrap.innerHTML = `<div class="field-row">
      <div class="field"><div class="field__label">专注（分钟）</div><input class="field__input" type="number" id="cw" min="1" max="180" value="${Math.round(s.focusWork/60)}" data-autofocus></div>
      <div class="field"><div class="field__label">休息（分钟）</div><input class="field__input" type="number" id="cb" min="1" max="60" value="${Math.round(s.focusBreak/60)}"></div>
    </div>`;
    const applyCustom = ()=>{
      const w = Math.min(180, Math.max(1, parseInt(wrap.querySelector('#cw').value,10)||25));
      const b = Math.min(60, Math.max(1, parseInt(wrap.querySelector('#cb').value,10)||5));
      wrap.querySelector('#cw').value = w;
      wrap.querySelector('#cb').value = b;
      FocusTimer.setCustom(w,b);
      Dialog.close();
    };
    Dialog.open({
      title:'自定义时长', bodyNode: wrap,
      actions:[{label:'确定', variant:'primary', onClick:applyCustom}]
    });
    wrap.addEventListener('keydown', e=>{
      if(e.key==='Enter'){
        e.preventDefault();
        applyCustom();
      }
    });
  }
  return { enter, exit, bind };
})();


/* ============================== 17.5 Reliability Guards ============================== */
(function reliabilityGuards(){
  document.addEventListener('keydown', e=>{
    if(e.key !== 'Escape') return;
    if(Dialog.isOpen()) Dialog.close();
  }, true);
})();


/* 2.3 Classroom controller — 独立、无滚动、真实测量 + 最终缩放 */
const ClassroomManager = (() => {
  let active=false;
  let statusText='';
  const view=document.getElementById('classroomView');
  const grid=document.getElementById('classroomGrid');
  const wrap=document.getElementById('classroomGridWrap');
  const esc=t=>Utils.escapeHtml(t||'');

  function render(){
    const day=Renderer.currentDayRecord();
    // 教室模式只展示“已布置作业”的学科：自动识别当天该科目是否有作业内容，
    // 无需再手动在学科设置里逐个隐藏。
    const subs=Renderer.visibleSubjects().filter(s=>{
      const a=day.assignments[s.id];
      return a && subjectItems(a).some(i=>i.text && i.text.trim().length>0);
    });
    const d=new Date(DateEngine.getViewingKey()+'T12:00:00');
    const dl=Utils.formatDateLine(d);
    document.getElementById('classroomDate').textContent=dl.date;
    document.getElementById('classroomWeekday').textContent=dl.weekday;
    // 直接从 QuoteEngine 取当日语录，避免读取编辑模式的 DOM。
    const q=QuoteEngine.getForDay(day);
    const zh=q.zh||'';
    const author=q.author||'';
    document.getElementById('classroomQuote').textContent=author?`“${zh}”  — ${author}`:`“${zh}”`;
    const priority=document.getElementById('classroomPriority');
    const priorityText=document.getElementById('classroomPriorityText');
    const note=(day.note||'').trim();
    priorityText.textContent=note||'今天最重要的一件事';
    priority.classList.toggle('is-empty',!note);
    const done=subs.filter(x=>itemsAllDone(subjectItems(day.assignments[x.id]))).length;
    const base = `今日作业 · ${done}/${subs.length} 项完成 · ${subs.length?Math.round(done/subs.length*100):0}%`;
    statusText = base;
    document.getElementById('classroomStatus').textContent = base;
    grid.innerHTML='';
    grid.style.transform='none';
    grid.classList.toggle('is-empty', subs.length===0);
    if(!subs.length){
      grid.innerHTML='<div class="classroom-empty">今天还没有已布置的作业</div>';
      return;
    }
    subs.forEach(sub=>{
      const a=day.assignments[sub.id]||{};
      const items=subjectItems(a);
      const c=document.createElement('article');
      c.className='classroom-card'+(itemsAllDone(items)?' is-done':''); c.setAttribute('role','listitem');
      const bodyHtml = items.length>1
        ? `<div class="classroom-card__items">`+items.map((it,idx)=>`<div class="classroom-item${it.completed?' is-done':''}"><span class="classroom-item__no">${idx+1}</span><span class="classroom-item__text">${it.text&&it.text.trim()?esc(it.text):'<span class="classroom-item__empty">…</span>'}</span></div>`).join('')+`</div>`
        : `<div class="classroom-card__body">${esc(a.text||'暂无作业')}</div>`;
      const doneMark = itemsAllDone(items);
      c.innerHTML=`<div class="classroom-card__title">${esc(sub.name)}</div>${bodyHtml}<div class="classroom-card__meta">${doneMark?'✓ 已完成':'待完成'}</div>`;
      grid.appendChild(c);
    });
  }

  function measure(){
    if(!active||!grid.children.length)return;
    if(grid.classList.contains('is-empty'))return;
    // LayoutEngine: 二分 + 局部微调 + 参数化兜底
    const layout = LayoutEngine.compute(wrap, grid, grid.children.length, {
      classroom: true,
      fallback: 'scale'  // 教室模式永不滚动
    });
    // applyStyles 已写入所有 CSS 变量（--class-gap, --class-pad, --class-body,
    // --class-title, --class-line），无需重复设置
    grid.style.visibility='';
    grid.style.overflow='visible';
    grid.classList.remove('is-scrollable');
    // reason 字段含缩放信息（仅 fallback 路径设置），正常路径显示"已适配一屏"
    // 使用结构化字段 scalePercent 而非字符串切分
    const suffix = layout.scalePercent !== undefined
      ? ` · ${layout.cols} 列 · 缩放 ${layout.scalePercent}%`
      : ` · ${layout.cols} 列 · 已适配一屏`;
    document.getElementById('classroomStatus').textContent=statusText+suffix;
  }

  function open(){
    active=true;
    render();
    view.hidden=false;
    view.setAttribute('aria-hidden','false');
    document.body.style.overflow='hidden';
    requestAnimationFrame(()=>requestAnimationFrame(measure));
    // 延迟到下一帧再请求全屏，避免事件竞态
    setTimeout(()=>document.documentElement.requestFullscreen().catch(()=>{}),50);
  }
  function close(){active=false;view.hidden=true;view.setAttribute('aria-hidden','true');document.body.style.overflow='';Renderer.renderModeUI();if(document.fullscreenElement) document.exitFullscreen();}
  function bind(){
    document.getElementById('classroomExitBtn').addEventListener('click',close);
    document.getElementById('classroomThemeBtn').addEventListener('click',()=>{Actions.cycleTheme();render();requestAnimationFrame(measure);});
    window.addEventListener('resize',Utils.debounce(measure,100));
    document.addEventListener('keydown',e=>{if(active&&e.key==='Escape'){e.preventDefault();close();}},true);
    document.addEventListener('fullscreenchange',()=>{
      // 只要还在教室模式且全屏被退出，就关闭教室模式
      if(active&&!document.fullscreenElement) close();
    });
  }
  return {open,close,bind,measure};
})();

/* ============================== 18. Init 初始化 ============================== */
(function init(){
  // 主题：系统跟随监听
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', ()=>{
    if(State.get().settings.theme==='system') Renderer.applyTheme();
  });

  State.pruneHistory();
  State.ensureDay(DateEngine.todayKey());
  State.persistNow();

  Renderer.setClassroomRerender(()=>ClassroomManager.measure());
  Renderer.renderAll();
  FocusTimer.init();
  FocusTimer.updateUI();
  FocusTimer.acquireWakeLock();
  window.addEventListener('beforeunload', ()=> FocusTimer.releaseWakeLock());

  CardInteraction.bind();
  Shortcuts.bind();
  FocusUI.bind();
  ClassroomManager.bind();

  document.getElementById('modeToggleBtn').addEventListener('click', Actions.toggleMode);
  document.getElementById('themeToggleBtn').addEventListener('click', Actions.cycleTheme);
  document.getElementById('settingsBtn').addEventListener('click', SettingsPanel.open);
  document.getElementById('shareImgBtn').addEventListener('click', ShareImage.generate);
  document.getElementById('quoteNextBtn').addEventListener('click', Actions.nextQuote);
  document.getElementById('copyYesterdayBtn').addEventListener('click', Actions.copyYesterday);
  document.getElementById('datePrevBtn').addEventListener('click', ()=>Actions.goRelative(-1));
  document.getElementById('dateNextBtn').addEventListener('click', ()=>Actions.goRelative(1));
  document.getElementById('dateTodayBtn').addEventListener('click', Actions.goToday);
  document.getElementById('onboardingClose').addEventListener('click', ()=>{
    State.set(s=>{ s.meta.onboardingShown = true; }, 'meta');
    Renderer.renderOnboarding();
  });

  const noteInput = document.getElementById('noteInput');
  noteDebounce = Utils.debounce((v)=>Actions.saveNote(v), 400);
  noteInput.addEventListener('input', (e)=>noteDebounce(e.target.value));

  DateEngine.start(
    (d)=>{
      Renderer.renderClock(d);
      if(!Dialog.isOpen() && !overlayVisible()) {/* 时钟每秒轻量更新，不触发整页重绘 */}
    },
    (newKey)=>{
      if(noteDebounce) noteDebounce.flush();
      State.ensureDay(newKey);
      State.persistNow();
      if(DateEngine.isViewingToday()) Renderer.renderAll();
      Toast.show('新的一天开始了');
    }
  );
  function overlayVisible(){ return !document.getElementById('focusOverlay').hidden; }

  window.addEventListener('resize', Utils.debounce(()=>Renderer.scheduleLayout(), 120));
  window.addEventListener('orientationchange', ()=>Renderer.scheduleLayout());
  if(window.ResizeObserver){
    const layoutObserver = new ResizeObserver(()=>Renderer.scheduleLayout());
    const gridWrapEl = document.getElementById('gridWrap');
    if(gridWrapEl) layoutObserver.observe(gridWrapEl);
  }


  // 窗口失焦/激活时重新校准布局，规避字体加载等造成的度量偏差
  window.addEventListener('load', ()=>Renderer.scheduleLayout());
})();
</script>
